  // Rodič, jehož e-mail škola nemá: kód přijde na adresu dítěte, dítě ho předá a rodič ho opíše (server zapíše rodiče ke žákovi).
  function diteFormular() {
    var d = L.dite || (L.dite = { krok: 1, rodic: L.email || "", dite: "", info: "", hotovo: null });
    var h = '<h2 style="margin:0 0 4px;font-size:18px">Ověření přes dítě</h2>';
    if (d.hotovo) {
      return h + '<div class="notice ok"><b>Hotovo, účet je aktivní.</b> Propojeno s: ' + d.hotovo.zaci.map(function (z) { return esc(z.zak) + " (" + esc(z.trida) + ")"; }).join(", ") +
        ". Teď se přihlaste svým e-mailem <b>" + esc(d.rodic) + "</b> a kódem, který vám přijde.</div>" +
        '<div class="foot"><button class="btn primary" data-act="l-rezim" data-r="gmail" style="width:100%">Přejít na přihlášení</button></div>';
    }
    if (d.krok === 1) {
      return h + '<p class="meta">Kód pošleme na adresu <b>dítěte</b> (tu, kterou škola eviduje u žáka). Dítě vám ho předá a vy ho opíšete – tím dítě potvrdí, že vás zná, a vy uvidíte jeho platby. Pokud tu adresu nezadáte správně, kód nepřijde.</p>' +
        '<form id="dk1-form"><label class="field">Váš e-mail (kterým jste se registrovali)<input type="text" id="dk-rodic" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="80" value="' + esc(d.rodic) + '"></label>' +
        '<label class="field">E-mail dítěte (žáka)<input type="text" id="dk-dite" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="80" autocomplete="off" value="' + esc(d.dite) + '"></label>' +
        '<div class="foot" style="margin-top:12px"><button class="btn primary" type="submit" style="width:100%">Poslat kód dítěti</button></div>' +
        '<p class="meta" style="text-align:center;margin-bottom:0"><button class="linkbtn" type="button" data-act="l-rezim" data-r="gmail">Zpět na přihlášení</button></p></form>';
    }
    return h + '<form id="dk2-form"><div class="notice info">' + esc(d.info) + "</div>" +
      '<label class="field">Kód od dítěte<input type="text" id="dk-kod" class="code-in" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000"></label>' +
      '<div class="foot" style="margin-top:12px"><button class="btn primary" type="submit" style="width:100%">Ověřit a aktivovat účet</button></div>' +
      '<p class="meta" style="text-align:center;margin-bottom:0"><button class="linkbtn" type="button" data-act="dite-znovu">Poslat kód znovu</button> · <button class="linkbtn" type="button" data-act="dite-zpet">Jiná adresa dítěte</button></p></form>';
  }

  function diteKod(znovu) {
    var d = L.dite;
    if (!znovu) { d.rodic = ($("dk-rodic").value || "").trim().toLowerCase(); d.dite = ($("dk-dite").value || "").trim().toLowerCase(); }
    if (!RE_MAIL1.test(d.rodic) || !RE_MAIL1.test(d.dite)) { chL("Zadejte platné e-mailové adresy rodiče i dítěte."); return; }
    run("Posílám kód dítěti…", api("rodicDiteKod", { email: d.rodic, diteEmail: d.dite })).then(function (r) {
      d.krok = 2; d.info = r.zprava;
      if (znovu) { toast("Kód poslán znovu."); return; }
      renderLogin();
    }).catch(function (e) { chL(e.message); });
  }

  function diteOverit() {
    var d = L.dite, kod = ($("dk-kod").value || "").replace(/\s+/g, "");
    if (!/^[0-9]{6}$/.test(kod)) { chL("Kód má šest číslic."); return; }
    run("Ověřuji…", api("rodicDiteOverit", { email: d.rodic, kod: kod })).then(function (r) {
      d.hotovo = r; L.email = d.rodic; renderLogin();
    }).catch(function (e) { var i = $("dk-kod"); if (i) { i.value = ""; i.focus(); } chL(e.message); });
  }

  function registraceFormular() {
    var prvni = L.prvni, zak = !prvni && L.typ === "zak";
    var h = '<form id="r-form" autocomplete="off">';
    if (prvni) {
      h += '<div class="notice"><b>První spuštění aplikace.</b> Zaregistrujte se e-mailem <b>' + esc(L.mailboxMaska) + "</b> – to je účet, pod kterým je aplikace nasazená a <b>do jehož schránky chodí bankovní oznámení o platbách</b>. " +
        "Jen z této schránky aplikace platby čte, proto musí být správce přihlášený právě tímto účtem. Stanete se školním adminem a ostatním pak schvalujete přístup.</div>" +
        '<label class="field">Název školy (nebo třídy)<small>Ukáže se v záhlaví aplikace.</small><input type="text" id="r-skola" maxlength="80" autocomplete="organization" value="' + esc(L.skolaNazev || "") + '"></label>' +
        '<label class="field">Web nebo symbol školy<small>Např. <b>jaroska.cz</b> nebo RED-IZO / IZO / IČO školy. Podle webu se aplikace přizpůsobí vaší škole (barva, logo) a pro školu se připraví tabulka.</small>' +
        '<input type="text" id="r-skolaid" maxlength="80" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="jaroska.cz"></label>';
    } else {
      h += '<label class="field">Jsem<select id="r-typ"><option value="ucitel">Učitel (zakládá sbírky a rozesílá QR platby)</option><option value="zak">Žák nebo rodič</option></select></label>' +
        '<div class="notice info" id="r-popis"></div>';
    }
    h += '<div class="two"><label class="field">Jméno a příjmení<small>Jak se zobrazí v aplikaci.</small><input type="text" id="r-jmeno" maxlength="60" autocomplete="name"></label>' +
      '<label class="field">Váš e-mail<small>' + (prvni ? "Musí to být " + esc(L.mailboxMaska) + "." : "Na něj přijde kód a budete se jím přihlašovat.") + '</small><input type="text" id="r-email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="80"></label></div>' +
      (prvni ? '<div class="two"><label class="field">Heslo<small>Aspoň 10 znaků. Správce se přihlašuje kódem z e-mailu <b>a</b> tímto heslem.</small><input type="password" id="r-heslo" autocomplete="new-password" maxlength="200"></label>' +
      '<label class="field">Heslo znovu<small>&nbsp;</small><input type="password" id="r-heslo2" autocomplete="new-password" maxlength="200"></label></div>' : "") +
      '<div id="r-profil"' + (zak ? " hidden" : "") + '>' +
      '<label class="field"><span id="r-iban-nadpis">' + (prvni ? "Číslo účtu nebo IBAN, na který se bude vybírat" : "Vlastní číslo účtu nebo IBAN (nepovinné)") + '</span><small id="r-iban-pozn">' +
      (prvni ? "Do QR kódů a e-mailů žákům. Např. 123456789/0800 – IBAN se dopočítá." : "Nechte prázdné a použije se účet správce vybraný níže. Např. 123456789/0800.") + '</small>' +
      '<input type="text" id="r-iban" data-iban="r-iban-out" maxlength="50" autocomplete="off" spellcheck="false"><div class="ibanout" id="r-iban-out"></div></label>' +
      (prvni ? '<div class="two"><label class="field">Název účtu (nepovinný)<small>Ukáže se v e-mailech s QR, např. „Třída 5.A“.</small><input type="text" id="r-nazev" maxlength="40" autocomplete="off"></label>' +
        '<label class="field">E-mail pro oznámení o platbách (nepovinný)<small>Sem přijde zpráva „vše zaplaceno“. Výchozí: váš e-mail.</small><input type="text" id="r-oznameni" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="80" autocomplete="off"></label></div>'
        : ((L.adminUcty || []).length ? '<label class="field">Když vlastní účet nevyplníte, použije se účet správce<select id="r-admin">' +
          L.adminUcty.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.jmeno) + (x.maska ? " – účet " + esc(x.maska) : "") + "</option>"; }).join("") + "</select></label>" +
          '<div class="notice info">Pokud zadáte <b>jiný</b> účet, než má správce, ukážeme vám po přihlášení, na jakou adresu musí banka posílat oznámení o platbách, aby je aplikace viděla.</div>' : "")) +
      "</div>" +
      '<div class="foot" style="margin-top:12px"><button class="btn primary" type="submit" id="r-btn" style="width:100%">' + (prvni || zak ? "Zaregistrovat a poslat kód" : "Odeslat registraci") + '</button></div></form>' +
      (prvni ? "" : '<p class="meta" style="text-align:center;margin-bottom:0">Už jste se zaregistrovali jako rodič a čekáte na schválení? <button class="linkbtn" type="button" data-act="dite-start">Ověřte se přes dítě</button>.</p>');
    return h;
  }

  // Podle zvolené role se ukáže nebo schová číslo účtu a vysvětlení.
  function ukazPoleRegistrace() {
    var sel = $("r-typ");
    if (sel) { sel.value = L.typ; }
    var typ = sel ? sel.value : "ucitel";
    if (sel) L.typ = typ;
    var pr = $("r-profil"); if (pr) pr.hidden = !L.prvni && typ === "zak";      // číslo účtu se ptáme správce (povinně) a učitele (nepovinně)
    var btn = $("r-btn"); if (btn) btn.textContent = L.prvni || typ === "zak" ? "Zaregistrovat a poslat kód" : "Odeslat registraci";
    var popis = $("r-popis");
    if (popis) {
      popis.textContent = typ === "zak"
        ? "Použijte e-mail, který škola eviduje u žáka nebo u vás jako rodiče – po ověření kódu se hned přihlásíte a uvidíte platby dítěte a QR kód k zaplacení. S jiným e-mailem se rodič může ověřit přes své dítě (kód na jeho adresu), jinak účet schvaluje školní admin."
        : "Registraci musí schválit školní admin. Kód se vám teď neposílá: až vás schválí, přijde vám e-mail a přihlásíte se kódem, který dostanete tehdy.";
    }
  }

  function odhlasenoServerem(zprava) {
    smazToken();
    api("stavPristupu").then(function (st) { ukazPrihlaseni(zprava || "Přihlášení vypršelo, přihlaste se znovu.", false, undefined, st); })
      .catch(function () { ukazPrihlaseni(zprava || "Přihlášení vypršelo, přihlaste se znovu.", false); });
  }

  function kodPoslat(znovu) {
    var email = znovu ? L.email : ($("lg-email").value || "").trim().toLowerCase();
    if (!RE_MAIL1.test(email)) { chL("Zadejte platnou e-mailovou adresu."); return; }
    if (!znovu) L.trvale = $("lg-trvale").checked;
    run("Posílám kód…", api("kodPoslat", { email: email })).then(function (r) {
      L.email = email; L.krok = 2; L.info = r.zprava;
      if (znovu) { toast("Kód poslán znovu."); return; }
      renderLogin();
    }).catch(function (e) { chL(e.message); });
  }

  function prihlasitKodem() {
    var kod = ($("lk-kod").value || "").replace(/\s+/g, "");
    if (!/^[0-9]{6}$/.test(kod)) { chL("Kód má šest číslic."); return; }
    run("Přihlašuji…", api("prihlasitKodem", { email: L.email, kod: kod })).then(function (r) {
      if (r.krokHeslo) {                       // správce: po kódu ještě heslo
        L.krok = 3; L.propustka = r.propustka; L.nastavitHeslo = !!r.nastavit; L.zprava = ""; renderLogin();
        return;
      }
      ulozToken(r.token, L.trvale);
      nastavUziv(r);
      zahajit();
    }).catch(function (e) {
      var inp = $("lk-kod"); if (inp) { inp.value = ""; inp.focus(); }
      chL(e.message);
    });
  }

  function prihlasitSpravce() {
    var h = $("la-heslo").value, h2 = L.nastavitHeslo ? $("la-heslo2").value : "";
    if (!h) { chL("Zadejte heslo."); return; }
    if (L.nastavitHeslo) {
      if (h.length < 10) { chL("Heslo musí mít aspoň 10 znaků."); return; }
      if (h !== h2) { chL("Obě hesla se musí shodovat."); return; }
    }
    run("Přihlašuji…", api("prihlasitSpravce", { email: L.email, propustka: L.propustka, heslo: h, heslo2: h2 })).then(function (r) {
      ulozToken(r.token, L.trvale);
      nastavUziv(r);
      zahajit();
    }).catch(function (e) {
      var i = $("la-heslo"); if (i) { i.value = ""; i.focus(); }
      var i2 = $("la-heslo2"); if (i2) i2.value = "";
      chL(e.message);
    });
  }

  function registrovat() {
    function v(id) { var el = $(id); return el ? (el.value || "").trim() : ""; }
    var email = v("r-email").toLowerCase(), typ = L.prvni ? "ucitel" : v("r-typ"), zak = typ === "zak";
    if (L.prvni && v("r-skola").length < 2) { chL("Zadejte název školy (nebo třídy)."); $("r-skola").focus(); return; }
    if (L.prvni && v("r-skolaid").length < 4) { chL("Zadejte web školy (např. jaroska.cz) nebo její symbol (RED-IZO / IZO / IČO)."); $("r-skolaid").focus(); return; }
    if (v("r-jmeno").length < 2) { chL("Zadejte své jméno a příjmení."); $("r-jmeno").focus(); return; }
    if (!RE_MAIL1.test(email)) { chL("Zadejte platnou e-mailovou adresu, kterou se budete přihlašovat."); $("r-email").focus(); return; }
    var args = { typ: typ, jmeno: v("r-jmeno"), email: email };
    if (L.prvni) {
      args.skola = v("r-skola"); args.skolaId = v("r-skolaid");
      var hs = $("r-heslo").value, hs2 = $("r-heslo2").value;
      if (hs.length < 10) { chL("Heslo správce musí mít aspoň 10 znaků."); $("r-heslo").focus(); return; }
      if (hs !== hs2) { chL("Obě hesla se musí shodovat."); $("r-heslo2").focus(); return; }
      args.heslo = hs; args.heslo2 = hs2;
    }
    if (L.prvni) {
      var u = normalizujUcet(v("r-iban"));
      if (!u.ok) { chL(u.chyba); $("r-iban").focus(); return; }
      var oznameni = v("r-oznameni").toLowerCase();
      if (oznameni && !RE_MAIL1.test(oznameni)) { chL("E-mail pro oznámení o platbách není platný (nebo pole nechte prázdné)."); $("r-oznameni").focus(); return; }
      args.iban = v("r-iban"); args.nazevUctu = v("r-nazev"); args.emailOznameni = oznameni;
    } else if (!zak) {
      if (v("r-iban")) {                                      // vlastní účet učitele je nepovinný
        var uu = normalizujUcet(v("r-iban"));
        if (!uu.ok) { chL(uu.chyba); $("r-iban").focus(); return; }
        args.iban = v("r-iban");
      }
      if ($("r-admin")) args.adminId = $("r-admin").value;
    }
    run(!L.prvni && !zak ? "Odesílám registraci…" : "Registruji…", api("registrovat", args)).then(function (r) {
      L.email = email;
      if (r && r.bezKodu) { L.krok = 3; L.bezKodu = true; L.zakCeka = false; renderLogin(); return; }     // učitel: bez kódu, čeká na schválení
      L.krok = 2; L.info = "Poslali jsme kód na " + email + ". Platí 10 minut.";
      renderLogin();
    }).catch(function (e) { chL(e.message); });
  }

  function registraceOverit() {
    var kod = ($("rk-kod").value || "").replace(/\s+/g, "");
    if (!/^[0-9]{6}$/.test(kod)) { chL("Kód má šest číslic."); return; }
    run("Ověřuji…", api("registraceOverit", { email: L.email, kod: kod })).then(function (r) {
      if (r.stav === "aktivni" && r.token) {              // vlastník, první správce nebo rodič žáka z tabulky: rovnou dovnitř
        ulozToken(r.token, false);
        nastavUziv(r);
        toast(L.prvni ? "Aplikace je připravená. Jste školní admin." : "E-mail je ověřený, jste přihlášen/a.");
        zahajit();
        return;
      }
      L.krok = 3; L.zakCeka = !!r.zak; renderLogin();
    }).catch(function (e) { var i = $("rk-kod"); if (i) { i.value = ""; i.focus(); } chL(e.message); });
  }

  function odhlasit() {
    var p = S.token ? api("odhlasit").catch(function () {}) : Promise.resolve();
    p.then(function () { smazToken(); return api("stavPristupu").catch(function () { return null; }); }).then(function (st) { ukazPrihlaseni("", false, undefined, st); });
  }

  // Po přihlášení se otevře první stránka, kterou role vidí.
  function zahajit(odznakUzZnam) {
    hlavickaPrihlaseny(true);
    if (moze("ucty") && !odznakUzZnam) api("stavPristupu").then(function (st) { odznak(st.cekajiciUctu || 0); }).catch(function () {});
    if (moze("cteni")) nactiPrehled();
    else if (moze("moje")) nactiMoje();
    else nactiInformace();
    predstahni();
  }

  function start() {
    S.token = nactiToken();
    nactiPohled();
    // Přihlášený uživatel: přehled se začne načítat HNED, souběžně s ověřením přihlášení (ušetří jedno čekání na server).
    if (S.token) { PRED = { cas: Date.now(), p: api("prehled") }; PRED.p.catch(function () {}); }
    api("stavPristupu").then(function (st) {
      if (!st.vyzadujePrihlaseni || st.prihlasen) {
        nastavUziv({ jmeno: st.jmeno, role: st.role || "skolni_admin", roleNazev: st.roleNazev, prava: st.prava, email: st.email, zobrazit: st.zobrazit, skola: st.skola, tema: st.tema });
        odznak(st.cekajiciUctu || 0);
        zahajit(true);
      } else {
        smazToken();
        ukazPrihlaseni("", st.bezUzivatelu, undefined, st);
      }
    }).catch(function (e) {
      app.innerHTML = '<div class="notice bad">Nepodařilo se spojit se serverem: ' + esc(e.message) + "</div>";
    });
  }

  // ---------- Zobrazení: přehled ----------
  function procento(s) {
    if (!s || !(s.ocekavano > 0)) return 0;
    return Math.max(0, Math.min(100, Math.round(s.vybrano / s.ocekavano * 100)));
  }
  function sklon(n, a, b, c) { n = Math.abs(n); return n === 1 ? a : (n >= 2 && n <= 4 ? b : c); }
  function kratkeDatum(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var o = { day: "numeric", month: "numeric" };
    if (d.getFullYear() !== new Date().getFullYear()) o.year = "numeric";
    return d.toLocaleDateString("cs-CZ", o);
  }

  // Značka „komu už QR e-mail odešel“ u žáka
  function emailChip(z) {
    if (z.emailStav === "odeslano") {
      var kolikrat = z.qrPocet > 1 ? " (" + z.qrPocet + "×)" : "";
      return '<span class="chip odeslano" title="QR e-mail odeslán ' + esc(dt(z.qrPosledni)) + kolikrat + '">✓ QR odesláno ' + esc(kratkeDatum(z.qrPosledni)) + kolikrat + "</span>";
    }
    if (z.emailStav === "neodeslano") return '<span class="chip neodeslano" title="QR e-mail žákovi zatím nikdy neodešel">✉ neodesláno</span>';
    if (z.emailStav === "bez") return '<span class="chip bez" title="Chybí platný e-mail nebo variabilní symbol – e-mail poslat nejde">bez e-mailu/VS</span>';
    return "";
  }
  function pripominkaText(z) {
    return z.pripPocet > 0 ? "připomínka " + kratkeDatum(z.pripPosledni) + (z.pripPocet > 1 ? " (" + z.pripPocet + "×)" : "") : "";
  }

  function kartaObsah(nazev, meta, so, c, em, zkontrolovano, extra, archiv) {
    var p = procento(so);
    return '<h3>' + esc(nazev) + (archiv ? ' <span class="chip archiv" title="Třída je v archivu – jen pro čtení">Archiv</span>' : "") + '</h3><div class="meta">' + meta + "</div>" + (extra || "") +
      '<div class="bar' + (so.vse ? " done" : "") + '"><i style="width:' + p + '%"></i></div>' +
      '<div class="row"><span class="big">' + kc(so.vybrano) + '</span><span class="meta">z ' + kc(so.ocekavano) + "</span>" +
      '<span class="right meta">' + so.pocetZaplaceno + "/" + so.pocetOcekavano + " žáků</span></div>" +
      '<div class="chips">' +
      (so.vse ? '<span class="chip zaplaceno">Vše zaplaceno</span>' : "") +
      (c.nezaplaceno ? '<span class="chip nezaplaceno">' + c.nezaplaceno + "× nezaplaceno</span>" : "") +
      (c.castecne ? '<span class="chip castecne">' + c.castecne + "× částečně</span>" : "") +
      (c.preplatek ? '<span class="chip preplatek">' + c.preplatek + "× přeplatek</span>" : "") +
      (c.rucne ? '<span class="chip rucne">' + c.rucne + "× ruční</span>" : "") +
      (so.upravenoRucne ? '<span class="chip rucni">✎ ' + so.upravenoRucne + "× upraveno ručně</span>" : "") +
      "</div>" +
      '<div class="chips">' +
      (em.neodeslano ? '<span class="chip neodeslano" title="Nezaplacení žáci, kterým QR e-mail ještě neodešel">✉ ' + em.neodeslano + "× QR neodesláno</span>"
        : (em.odeslano ? '<span class="chip odeslano">✓ QR rozesláno (' + em.odeslano + ")</span>" : "")) +
      (em.bez ? '<span class="chip bez">' + em.bez + "× bez e-mailu/VS</span>" : "") +
      "</div>" +
      '<div class="meta" style="margin-top:8px">Zkontrolováno: ' + esc(pred(zkontrolovano)) + "</div>";
  }

  // Karta sbírky v jedné třídě (zobrazení „podle tříd“). skup = skupina, pokud je tahle sbírka jen částí sbírky přes víc tříd.
  function kartaCekajici(nazev, meta, s) {
    return '<div class="card pendingcard" aria-busy="true" title="Sbírka se zakládá v tabulce…">' +
      kartaObsah(nazev, '<span class="zapisspin"></span>' + meta, s.souhrn, s.pocty, s.emaily || {}, "", "", false) + "</div>";
  }
  function kartaSbirky(s, skup) {
    if (s.pending) return kartaCekajici(s.nazev, "zakládá se v tabulce…", s);
    var extra = skup ? '<div class="skupcasti"><button class="chip typ wrap" data-act="detail-skupina" data-skupina="' + esc(skup.id) + '" title="Otevřít celou sbírku, všechny třídy dohromady">součást sbírky ve ' +
      skup.casti.length + " " + sklon(skup.casti.length, "třídě", "třídách", "třídách") + " (" + skup.souhrn.pocetOcekavano + " žáků celkem) →</button></div>" : "";
    return '<div class="card click' + (s.archiv ? " archivni" : "") + '" data-act="detail" data-col="' + s.colIndex + '" data-trida="' + s.tridaId + '">' +
      kartaObsah(s.nazev, "sloupec " + esc(s.colLetter) + " · SS " + esc(s.specSymbol), s.souhrn, s.pocty, s.emaily || {}, s.zkontrolovano, extra, s.archiv) + "</div>";
  }

  // Karta celé sbírky (zobrazení „dohromady“): součty za všechny třídy, ve kterých sbírka běží.
  function kartaSkupiny(g) {
    if (g.pending) return kartaCekajici(g.nazev, "zakládá se v tabulce…", g);
    var vice = g.casti.length > 1;
    var akce = vice ? 'data-act="detail-skupina" data-skupina="' + esc(g.id) + '"' : 'data-act="detail" data-col="' + g.casti[0].colIndex + '" data-trida="' + g.casti[0].tridaId + '"';
    var meta = (vice ? g.casti.length + " " + sklon(g.casti.length, "třída", "třídy", "tříd") : "třída") + ": " + g.casti.map(function (c) { return esc(c.tridaNazev); }).join(", ");
    var extra = vice ? '<div class="skupcasti">' + g.casti.map(function (c) {
      return '<span class="chip" title="' + esc(c.tridaNazev) + (c.archiv ? " (archiv)" : "") + ': vybráno ' + esc(kc(c.souhrn.vybrano)) + ' z ' + esc(kc(c.souhrn.ocekavano)) + '">' + esc(c.tridaNazev) + (c.archiv ? " (archiv)" : "") + " · " + c.souhrn.pocetZaplaceno + "/" + c.souhrn.pocetOcekavano + "</span>";
    }).join("") + "</div>" : "";
    return '<div class="card click' + (g.archiv ? " archivni" : "") + '" ' + akce + ">" + kartaObsah(g.nazev, meta, g.souhrn, g.pocty, g.emaily || {}, g.zkontrolovano, extra, g.archiv) + "</div>";
  }

  function prepinacPohledu() {
    return '<div class="seg inline" role="group" aria-label="Zobrazení sbírek" title="Dohromady: sbírka založená pro víc tříd je jedna, součty jsou za všechny třídy. Podle tříd: každá třída zvlášť.">' +
      [["dohromady", "Dohromady"], ["tridy", "Podle tříd"]].map(function (z) {
        return '<button type="button" data-act="pohled" data-p="' + z[0] + '" aria-pressed="' + (S.pohled === z[0]) + '">' + z[1] + "</button>";
      }).join("") + "</div>";
  }

  function renderPrehled() {
    var d = S.prehled, skupVse = d.skupiny || [], dohromady = S.pohled === "dohromady";
    var aktTridy = d.tridy.filter(function (t) { return !t.archiv; }), archTridy = d.tridy.filter(function (t) { return t.archiv; });
    var skup = skupVse.filter(function (g) { return !g.archiv; }), skupArch = skupVse.filter(function (g) { return g.archiv; });
    var pocet = dohromady ? skup.length : d.sbirky.filter(function (x) { return !x.archiv; }).length;
    var h = '<div class="row"><div class="grow"><h1>Sbírky</h1><p class="sub">' +
      pocet + " " + sklon(pocet, "sbírka", "sbírky", "sbírek") + " · " +
      aktTridy.length + " " + sklon(aktTridy.length, "třída", "třídy", "tříd") + " · " + d.pocetZaku + " " + sklon(d.pocetZaku, "žák", "žáci", "žáků") +
      (skupArch.length || archTridy.length ? " · v archivu " + (dohromady ? skupArch.length + " " + sklon(skupArch.length, "sbírka", "sbírky", "sbírek") : archTridy.length + " " + sklon(archTridy.length, "třída", "třídy", "tříd")) : "") + "</p></div>" +
      (d.tridy.length > 1 ? prepinacPohledu() : "") +
      (moze("zapis") ? '<button class="btn" data-go="zaci">Žáci a třídy</button> <button class="btn primary" data-act="nova">+ Nová sbírka</button>' : "") + "</div>";
    if (!aktTridy.length) {
      h += '<div class="card empty">Zatím tu není žádná aktivní třída.' + (moze("zapis") ? '<p><button class="btn primary" data-act="trida-nova">+ Nová třída</button></p>' : "") + "</div>";
    }
    if (dohromady) {
      if (aktTridy.length && !skup.length) {
        h += '<div class="card empty" style="margin-top:14px">Zatím tu není žádná sbírka.' + (moze("zapis") ? '<p><button class="btn primary" data-act="nova">+ Nová sbírka</button></p>' : "") + "</div>";
      } else if (skup.length) {
        h += '<div class="grid" style="margin-top:14px">' + skup.map(kartaSkupiny).join("") + "</div>";
      }
      if (skupArch.length) {
        h += '<div class="row tridahead"><h2 class="grow">Archiv <span class="meta">· proběhlé sbírky archivovaných tříd (jen pro čtení)</span></h2></div>' +
          '<div class="grid" style="margin-top:10px">' + skupArch.map(kartaSkupiny).join("") + "</div>";
      }
    } else {
      var sCasti = {};
      skupVse.forEach(function (g) { if (g.casti.length > 1) g.casti.forEach(function (c) { sCasti[c.tridaId + ":" + c.specSymbol] = g; }); });
      aktTridy.concat(archTridy).forEach(function (t) {
        h += '<div class="row tridahead"><h2 class="grow">' + esc(t.nazev) + (t.archiv ? ' <span class="chip archiv">Archiv</span>' : "") + ' <span class="meta">· ' + t.pocetZaku + " " + sklon(t.pocetZaku, "žák", "žáci", "žáků") + "</span></h2>" +
          (moze("zapis") && !t.archiv ? '<button class="btn small primary" data-act="nova" data-trida="' + t.id + '">+ Nová sbírka</button>' : "") + "</div>";
        if (!t.sbirky.length) {
          h += '<div class="card empty" style="margin-top:10px">' + (t.archiv ? "V téhle třídě nebyla žádná sbírka." : (t.pocetZaku ? "Ve třídě zatím není žádná sbírka." :
            'Třída je zatím prázdná. ' + (moze("zapis") ? '<button class="linkbtn" data-act="import" data-trida="' + t.id + '">Přidat žáky</button>' : ""))) + "</div>";
        } else {
          h += '<div class="grid" style="margin-top:10px">' + t.sbirky.map(function (s) { return kartaSbirky(s, sCasti[s.tridaId + ":" + s.specSymbol]); }).join("") + "</div>";
        }
      });
    }
    app.innerHTML = h;
  }

  // ---------- Zobrazení: detail sbírky ----------
  var FILTRY = [
    ["ucast", "Ve sbírce"], ["neodeslano", "QR neodesláno"], ["odeslano", "QR odesláno"], ["nezaplaceno", "Nezaplaceno"], ["castecne", "Částečně"], ["zaplaceno", "Zaplaceno"],
    ["preplatek", "Přeplatek"], ["rucnepl", "Upraveno ručně"], ["rucne", "Ruční poznámka"], ["bez", "Bez e-mailu/VS"], ["nic", "Mimo sbírku"], ["vse", "Všichni"]
  ];
  var OKRAJOVE_FILTRY = ["rucne", "rucnepl", "preplatek", "nic", "bez", "neodeslano", "odeslano"];

  function patriDoFiltru(z, f) {
    if (f === "vse") return true;
    if (f === "ucast") return z.stav !== "nic";
    if (f === "rucnepl") return !!(z.upravenoRucne || (z.rucniPlatby && z.rucniPlatby.length));
    if (f === "neodeslano" || f === "odeslano" || f === "bez") return z.emailStav === f;
    return z.stav === f;
  }

  function poznamkyZaka(z) {
    return (z.rucniPlatby || []).map(function (p) { return p.pozn; }).filter(Boolean).join(" · ");
  }

  function renderDetail() {
    var d = S.detail, s = d.sbirka, so = d.souhrn, p = procento(so), em = d.emaily || { odeslano: 0, neodeslano: 0, bez: 0 }, sk = d.skupina;
    var jeArch = !!(sk ? sk.archiv : s.archiv);                                         // celá sbírka je v archivní třídě: jen pro čtení
    var castArch = sk && !sk.archiv ? sk.casti.filter(function (c) { return c.archiv; }).map(function (c) { return c.tridaNazev; }) : [];
    var mozeZapis = moze("zapis") && !jeArch, mozeOdesilat = moze("odesilani") && !jeArch;
    if (sk && S.detailTrida && !sk.casti.some(function (c) { return String(c.tridaId) === S.detailTrida; })) S.detailTrida = "";
    var h = '<p style="margin:18px 0 0"><button class="linkbtn" data-go="prehled">← Všechny sbírky</button></p>' +
      '<div class="row"><div class="grow"><h1>' + esc(s.nazev) + (jeArch ? ' <span class="chip archiv">Archiv</span>' : "") + '</h1><p class="sub">' +
      (sk ? sk.casti.length + " " + sklon(sk.casti.length, "třída", "třídy", "tříd") + ": " + esc(s.tridaNazev) : "třída " + esc(s.tridaNazev) + " · sloupec " + esc(s.colLetter) + " · SS " + esc(s.specSymbol)) +
      " · založeno " + esc(dt(s.vytvoreno)) + " · zkontrolováno " + esc(pred(s.zkontrolovano)) + "</p></div></div>" +
      (jeArch ? '<div class="notice">Třída je <b>v archivu</b> – sbírka je jen pro čtení (nekontrolují se platby, neposílají se e-maily, nic se nedá upravit). Pro práci s ní třídu obnovte v sekci Žáci a třídy.</div>' : "") +
      (castArch.length ? '<div class="notice">Část sbírky (třída ' + castArch.map(esc).join(", ") + ') je <b>v archivu</b> – kontrola plateb a e-maily se týkají jen aktivních tříd, v archivní třídě se nic nemění.</div>' : "") +
      '<div class="row">' +
      (mozeZapis ? '<button class="btn primary" data-act="kontrola">Zkontrolovat platby teď</button>' : "") +
      (mozeOdesilat ? '<button class="btn" data-act="nahled" data-typ="qr">Poslat QR platby…</button>' +
        '<button class="btn" data-act="nahled" data-typ="pripominka">Poslat připomínky…</button>' +
        '<span class="meta">E-maily se nikdy neodešlou bez potvrzení.</span>' : "") +
      (moze("mazani") ? '<button class="btn danger right" data-act="sbirka-smazat" title="Smaže sbírku ve všech třídách. Vyžaduje vaše heslo.">Smazat sbírku…</button>' : "") + "</div>" +
      '<div class="stats">' +
      '<div class="stat"><div class="k">Vybráno</div><div class="v">' + kc(so.vybrano) + "</div></div>" +
      '<div class="stat"><div class="k">Cíl</div><div class="v">' + kc(so.ocekavano) + "</div></div>" +
      '<div class="stat"><div class="k">Zaplatilo</div><div class="v">' + so.pocetZaplaceno + " / " + so.pocetOcekavano + "</div></div>" +
      '<div class="stat"><div class="k">Splněno</div><div class="v">' + p + " %</div></div>" +
      '<div class="stat"><div class="k">QR e-mail odeslán</div><div class="v">' + em.odeslano + " / " + (em.odeslano + em.neodeslano) + "</div>" +
      (em.neodeslano ? '<div class="meta" style="color:var(--warn)">ještě ' + em.neodeslano + " bez QR</div>" : "") + "</div></div>" +
      '<div class="bar' + (so.vse ? " done" : "") + '"><i style="width:' + p + '%"></i></div>';

    if (sk) {
      h += '<h2>Po třídách</h2><div class="tablewrap"><table class="tbl casti-tab"><thead><tr><th>Třída</th><th class="num">Vybráno</th><th class="num">Cíl</th><th class="num">Zaplatilo</th><th>Specifický symbol</th><th></th></tr></thead><tbody>';
      sk.casti.forEach(function (c) {
        h += "<tr><td><b>" + esc(c.tridaNazev) + "</b>" + (c.archiv ? ' <span class="chip archiv">Archiv</span>' : "") + '</td><td class="num" data-l="Vybráno">' + kc(c.souhrn.vybrano) + '</td><td class="num" data-l="Cíl">' + kc(c.souhrn.ocekavano) +
          '</td><td class="num" data-l="Zaplatilo">' + c.souhrn.pocetZaplaceno + " / " + c.souhrn.pocetOcekavano + '</td><td data-l="SS">' + esc(c.specSymbol) + "</td>" +
          '<td class="num"><button class="linkbtn" data-act="detail" data-col="' + c.colIndex + '" data-trida="' + c.tridaId + '" title="Otevřít jen tuhle třídu">Jen tahle třída →</button></td></tr>';
      });
      h += "</tbody></table></div>";
    }

    var vTride = d.studenti.filter(function (z) { return !S.detailTrida || String(z.tridaId) === S.detailTrida; });
    h += '<h2>Žáci</h2>';
    if (sk && sk.casti.length > 1) {
      h += '<div class="filters" role="group" aria-label="Třída"><button data-act="trida-filtr" data-t="" aria-pressed="' + (S.detailTrida === "") + '">Všechny třídy (' +
        d.studenti.filter(function (z) { return z.stav !== "nic"; }).length + ")</button>";
      sk.casti.forEach(function (c) {
        var n = d.studenti.filter(function (z) { return String(z.tridaId) === String(c.tridaId) && z.stav !== "nic"; }).length;
        h += '<button data-act="trida-filtr" data-t="' + c.tridaId + '" aria-pressed="' + (S.detailTrida === String(c.tridaId)) + '">' + esc(c.tridaNazev) + " (" + n + ")</button>";
      });
      h += "</div>";
    }
    h += '<div class="filters">';
    FILTRY.forEach(function (f) {
      var n = vTride.filter(function (z) { return patriDoFiltru(z, f[0]); }).length;
      if (!n && f[0] !== S.filtr && OKRAJOVE_FILTRY.indexOf(f[0]) !== -1) return;   // prázdné okrajové filtry se neukazují
      h += '<button data-act="filtr" data-f="' + f[0] + '" aria-pressed="' + (S.filtr === f[0]) + '">' + esc(f[1]) + " (" + n + ")</button>";
    });
    h += "</div>" + (mozeZapis ? '<p class="hint">Stav žáka upravíte <b>pravým tlačítkem</b> na řádku (nebo tlačítkem ⋯): ruční zaplacení s poznámkou, změna částky, přidání do sbírky.</p>' : "");

    var studenti = vTride.filter(function (z) { return patriDoFiltru(z, S.filtr); });
    if (!studenti.length) {
      h += '<div class="card empty">Nikdo v tomhle výběru.</div>';
    } else {
      h += '<div class="tablewrap"><table class="tbl"><thead><tr><th>Žák</th>' + (sk ? "<th>Třída</th>" : "") + '<th>VS</th><th class="num">Zaplaceno</th><th class="num">Cíl</th><th>Stav</th><th>QR e-mail</th><th></th></tr></thead><tbody>';
      studenti.forEach(function (z) {
        var pozn = poznamkyZaka(z);
        var rucniChip = (z.upravenoRucne || (z.rucniPlatby && z.rucniPlatby.length)) ? ' <span class="chip rucni" title="Stav je upraven ručně">✎ upraveno ručně</span>' : "";
        var pr = pripominkaText(z);
        h += '<tr class="zak' + (z.stav === "nic" ? " mimo" : "") + (z.emailStav === "neodeslano" ? " neodeslano" : "") + (z.archiv ? " archivni" : "") + '" data-radek="' + z.radek + '" data-trida="' + z.tridaId + '"' + (z.archiv ? ' data-archiv="1"' : "") + '><td><b>' + esc(z.prijmeni) + "</b> " + esc(z.jmeno) + '<div class="meta hide-m">' + esc(z.email) + "</div></td>" +
          (sk ? '<td data-l="Třída">' + esc(z.tridaNazev) + (z.archiv ? ' <span class="chip archiv">Archiv</span>' : "") + "</td>" : "") +
          '<td data-l="VS" class="hide-m">' + esc(z.vs) + "</td>" +
          '<td class="num" data-l="Zaplaceno">' + (z.stav === "nic" || z.stav === "rucne" ? "—" : kc(z.zaplaceno)) + "</td>" +
          '<td class="num" data-l="Cíl">' + (z.ocekavano > 0 ? kc(z.ocekavano) : "—") + "</td>" +
          "<td>" + chip(z.stav, z.pending) + rucniChip + (z.stav === "rucne" ? ' <span class="meta">„' + esc(z.text) + "“</span>" : "") +
          (pozn ? '<div class="meta">📝 ' + esc(pozn) + "</div>" : "") + "</td>" +
          '<td data-l="QR e-mail">' + (emailChip(z) || '<span class="meta">—</span>') + (pr ? '<div class="meta">' + esc(pr) + "</div>" : "") + "</td>" +
          '<td class="akce">' + (mozeZapis && !z.archiv ? '<button class="kebab" data-act="menu-zak" data-radek="' + z.radek + '" data-trida="' + z.tridaId + '" aria-haspopup="menu" aria-label="Upravit stav žáka ' + esc(z.prijmeni + " " + z.jmeno) + '">⋯</button>' : "") + "</td></tr>";
      });
      h += "</tbody></table></div>";
    }

    h += vysledekKontroly(d);
    h += nesparovaneHtml(d);
    h += "<h2>Přijaté platby (" + d.platby.length + ")</h2>" + tabulkaPlateb(d.platby, false, !!sk);
    app.innerHTML = h;
  }

  // Jedna karta s tím, co našla ruční kontrola v Gmailu – proč se platba mohla nespárovat
  function diagKarta(g, ss, tridaNazev) {
    var schranka = (S.nastaveni && S.nastaveni.gmailUcet) || "";
    var h = '<div class="card"' + (tridaNazev ? ' style="margin-bottom:10px"' : "") + ">" + (tridaNazev ? "<b>Třída " + esc(tridaNazev) + "</b> · SS " + esc(ss) + "<br>" : "");
    if (!g.zprav) {
      h += '<div class="notice bad"><b>V Gmailu jsem nenašel žádný e-mail se specifickým symbolem ' + esc(ss) + ".</b> Hledám ve schránce <b>" + esc(schranka) + "</b>. Zkontrolujte, že:" +
        "<br>• platba byla odeslána se <b>specifickým symbolem " + esc(ss) + "</b> (ne jen s variabilním),<br>• bankovní oznámení opravdu chodí do schránky " + esc(schranka) +
        " (ne jen na jinou adresu – případně nastavte přeposílání),<br>• e-mail od banky není přeposlaný ručně (přeposlané zprávy mají jiného odesílatele).</div>";
    } else {
      h += '<div class="meta">Nalezeno e-mailů se symbolem ' + esc(ss) + ": <b>" + g.zprav + "</b> · přijato jako platba: <b>" + g.prijato + "</b>" +
        (g.neZBanky ? " · nepochází od banky: " + g.neZBanky : "") + (g.neprichozi ? " · odchozí: " + g.neprichozi : "") + (g.bezCastky ? " · bez částky: " + g.bezCastky : "") + (g.neobsahujeSS ? " · jiný SS: " + g.neobsahujeSS : "") + "</div>";
      if (g.neZBanky) h += '<div class="notice bad">' + g.neZBanky + " " + sklon(g.neZBanky, "e-mail se symbolem", "e-maily se symbolem", "e-mailů se symbolem") + " " + esc(ss) + " odeslala jiná adresa než banka" +
        (g.ukazkyOdesilatelu && g.ukazkyOdesilatelu.length ? " (" + esc(g.ukazkyOdesilatelu.join("; ")) + ")" : "") + " – takové e-maily se z bezpečnosti nezapočítávají. Pokud jde o vaši banku, přidejte její doménu v Nastavení → Banka.</div>";
      if (g.odmitnuto && g.odmitnuto.length) {
        h += '<ul class="zlist">' + g.odmitnuto.map(function (o) {
          return "<li>" + (o.datum ? esc(dt(o.datum)) + " · " : "") + (o.castka ? esc(kc(o.castka)) + " · " : "") + (o.vs ? "VS " + esc(o.vs) + " · " : "") + esc(o.duvod) + "</li>";
        }).join("") + "</ul>";
      }
    }
    if (g.dotaz) h += '<div class="meta" style="margin-top:10px">Hledaný dotaz v Gmailu: <code>' + esc(g.dotaz) + "</code></div>";
    return h + "</div>";
  }

  // Co našla poslední ruční kontrola v Gmailu (jen dokud je detail otevřený)
  function vysledekKontroly(d) {
    var k = S.kontrola;
    if (!k) return "";
    if (!d.skupina) {
      if (!k.diag || k.col !== d.sbirka.colIndex || k.tridaId !== d.sbirka.tridaId) return "";
      return "<h2>Výsledek poslední kontroly</h2>" + diagKarta(k.diag, d.sbirka.specSymbol, "");
    }
    if (k.skupina !== d.skupina.id || !k.casti) return "";
    var h = "";
    k.casti.forEach(function (c) {
      var cast = null;
      d.skupina.casti.forEach(function (x) { if (x.colIndex === c.colIndex && x.tridaId === c.tridaId) cast = x; });
      if (c.diag && cast) h += diagKarta(c.diag, cast.specSymbol, c.tridaNazev);
    });
    return h ? "<h2>Výsledek poslední kontroly</h2>" + h : "";
  }

  function nesparovaneHtml(d) {
    var n = d.nesparovane || [], sk = !!d.skupina;
    if (!n.length) return "";
    var ucet = S.nastaveni && S.nastaveni.gmailUcet ? S.nastaveni.gmailUcet : "";
    var h = "<h2>Nespárované platby (" + n.length + ')</h2><div class="notice">Tyhle platby přišly na účet se specifickým symbolem sbírky, ale <b>nepodařilo se je přiřadit žákovi</b> – nezapočítaly se. ' +
      (moze("zapis") ? "Opravte VS / přidejte žáka do sbírky a spusťte kontrolu znovu, nebo platbu zapište žákovi ručně (pravé tlačítko na řádku žáka)." : "") + "</div>" +
      '<div class="tablewrap"><table class="tbl" id="nespar"><thead><tr><th>Datum</th>' + (sk ? "<th>Třída</th>" : "") + '<th class="num">Částka</th><th>VS</th><th>Odesílatel</th><th>Proč se nespárovala</th><th>E-mail</th></tr></thead><tbody>';
    n.forEach(function (p) {
      h += "<tr><td>" + esc(dt(p.datum)) + "</td>" + (sk ? '<td data-l="Třída">' + esc(p.tridaNazev || "") + "</td>" : "") + '<td class="num" data-l="Částka">' + kc(p.castka) + '</td><td data-l="VS">' + (p.vs ? esc(p.vs) : "—") + "</td>" +
        '<td data-l="Odesílatel">' + (p.platce ? esc(p.platce) : '<span class="meta">—</span>') + "</td><td>" + esc(p.duvod) + "</td>" +
        "<td>" + (p.id ? '<button class="linkbtn" data-act="zprava" data-id="' + esc(p.id) + '" title="Zobrazit text bankovního e-mailu (schránka ' + esc(ucet) + ')">Zobrazit</button>' : "") + "</td></tr>";
    });
    return h + "</tbody></table></div>";
  }

  function tabulkaPlateb(platby, ukazSbirku, ukazTridu) {
    if (!platby.length) return '<div class="card empty">Zatím žádné zaznamenané platby.</div>';
    var tridy = {};
    platby.forEach(function (p) { if (p.trida) tridy[p.trida] = true; });
    var vicTrid = Object.keys(tridy).length > 1;
    var ucet = S.nastaveni && S.nastaveni.gmailUcet ? S.nastaveni.gmailUcet : "";
    var h = '<div class="tablewrap"><table class="tbl"><thead><tr><th>Datum</th>' + (ukazSbirku ? "<th>Sbírka</th>" : "") + (ukazTridu ? "<th>Třída</th>" : "") +
      '<th>Žák</th><th>VS</th><th class="num">Částka</th><th>Poznámka</th><th>E-mail</th></tr></thead><tbody>';
    platby.forEach(function (p) {
      var pozn;
      if (p.rucni) {
        pozn = '<span class="chip rucni">✎ ručně</span>' + (p.pozn ? " " + esc(p.pozn) : "") + (p.kdo ? ' <span class="meta">(' + esc(p.kdo) + ")</span>" : "");
      } else {
        pozn = p.poznamka ? '<span class="chip castecne wrap">' + esc(p.poznamka) + "</span>" : "";
      }
      h += "<tr><td>" + esc(p.datum) + "</td>" + (ukazSbirku ? '<td data-l="Sbírka">' + esc(p.sbirka) + (vicTrid && p.trida ? ' <span class="meta">· ' + esc(p.trida) + "</span>" : "") + "</td>" : "") +
        (ukazTridu ? '<td data-l="Třída">' + esc(p.trida || "") + "</td>" : "") +
        "<td>" + (p.zak ? esc(p.zak) : '<span class="meta">nepřiřazeno</span>') + '</td><td data-l="VS" class="hide-m">' + esc(p.vs) + "</td>" +
        '<td class="num">' + kc(p.castka) + "</td><td>" + pozn + "</td>" +
        "<td>" + (p.odkaz ? '<button class="linkbtn" data-act="zprava" data-id="' + esc(p.id) + '" title="Zobrazit text bankovního e-mailu přímo tady">Zobrazit</button> · ' +
          '<a href="' + esc(p.odkaz) + '" target="_blank" rel="noopener noreferrer" title="Otevřít v Gmailu (účet ' + esc(ucet) + ')">Gmail ↗</a>'
          : (p.rucni ? '<span class="meta">zadáno ručně</span>' : "")) + "</td></tr>";
    });
    return h + "</tbody></table></div>";
  }

  // ---------- Zobrazení: historie ----------
  function renderHistorie() {
    var all = S.historie.platby;
    var sbirky = {}, tridy = {};
    all.forEach(function (p) {
      if (S.tridaFiltr && String(p.tridaId) !== S.tridaFiltr) return;
      sbirky[p.specSymbol] = p.sbirka;
    });
    all.forEach(function (p) { if (p.tridaId !== null && p.tridaId !== undefined && p.tridaId !== "") tridy[p.tridaId] = p.trida; });
    if (S.sbirkaFiltr && !sbirky[S.sbirkaFiltr]) S.sbirkaFiltr = "";
    var q = S.hledani.toLowerCase();
    var list = all.filter(function (p) {
      if (S.tridaFiltr && String(p.tridaId) !== S.tridaFiltr) return false;
      if (S.sbirkaFiltr && p.specSymbol !== S.sbirkaFiltr) return false;
      if (!q) return true;
      return (p.zak + " " + p.vs + " " + p.sbirka + " " + p.poznamka).toLowerCase().indexOf(q) !== -1;
    });
    var suma = list.reduce(function (a, p) { return a + (p.castka || 0); }, 0);
    var h = "<h1>Historie plateb</h1><p class=\"sub\">" + list.length + " plateb · celkem " + kc(suma) + '</p>' +
      '<div class="row" style="margin-bottom:12px"><input type="search" id="hled" placeholder="Hledat žáka, VS, sbírku…" value="' + esc(S.hledani) + '" class="grow">';
    if (Object.keys(tridy).length > 1) {
      h += '<select id="htr"><option value="">Všechny třídy</option>';
      Object.keys(tridy).forEach(function (id) {
        h += '<option value="' + esc(id) + '"' + (id === S.tridaFiltr ? " selected" : "") + ">" + esc(tridy[id]) + "</option>";
      });
      h += "</select>";
    }
    h += '<select id="hsb"><option value="">Všechny sbírky</option>';
    Object.keys(sbirky).forEach(function (ss) {
      h += '<option value="' + esc(ss) + '"' + (ss === S.sbirkaFiltr ? " selected" : "") + ">" + esc(sbirky[ss]) + " (" + esc(ss) + ")</option>";
    });
    h += "</select></div><div id=\"htab\">" + tabulkaPlateb(list, true) + "</div>";
    app.innerHTML = h;
    var inp = $("hled");
    inp.addEventListener("input", function () {
      S.hledani = inp.value;
      var pos = inp.selectionStart;
      renderHistorie();
      var n = $("hled"); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {}
    });
    $("hsb").addEventListener("change", function (ev) { S.sbirkaFiltr = ev.target.value; renderHistorie(); });
    if ($("htr")) $("htr").addEventListener("change", function (ev) { S.tridaFiltr = ev.target.value; renderHistorie(); });
  }

  // ---------- Zobrazení: žáci a třídy ----------
  function trOtevrena(id) {
    var v = S.otevrene[id];
    return v === undefined ? (S.zaci && S.zaci.tridy.length === 1) : !!v;
  }

  function renderZaci() {
    var d = S.zaci, zapis = moze("zapis"), arch = d.archiv || [];
    var celkem = d.tridy.reduce(function (a, t) { return a + t.pocetZaku; }, 0);
    var h = '<div class="row"><div class="grow"><h1>Žáci a třídy</h1><p class="sub">' + d.tridy.length + " " + sklon(d.tridy.length, "třída", "třídy", "tříd") +
      " · " + celkem + " " + sklon(celkem, "žák", "žáci", "žáků") + (arch.length ? " · v archivu " + arch.length : "") + "</p></div>" +
      (zapis ? '<button class="btn primary" data-act="trida-nova">+ Nová třída</button>' : "") + "</div>";
    if (!d.tridy.length) {
      h += '<div class="card empty">Zatím tu není žádná aktivní třída. Založte první tlačítkem „Nová třída“.</div>' + archivHtml(arch);
      app.innerHTML = h;
      return;
    }
    h += '<div class="row" style="margin:6px 0 4px"><input type="search" id="zhled" class="grow" placeholder="Hledat žáka, e-mail nebo VS ve všech třídách…" value="' + esc(S.hledaniZaku) + '"></div>';
    d.tridy.forEach(function (t) {
      var id = t.id;
      h += '<section class="tridasekce" data-trida="' + id + '"><details class="tcls" data-trida="' + id + '"' + (trOtevrena(id) ? " open" : "") + "><summary><h2>" + esc(t.nazev) + '</h2><span class="meta">' + t.pocetZaku + " " +
        sklon(t.pocetZaku, "žák", "žáci", "žáků") + " · " + t.pocetSbirek + " " + sklon(t.pocetSbirek, "sbírka", "sbírky", "sbírek") + '</span></summary><div class="tbody">' +
        '<div class="row" style="margin-bottom:8px">' +
        (t.pending ? '<span class="meta"><span class="zapisspin"></span>třída se zakládá…</span>' : "") +
        (zapis ? '<button class="btn small primary" data-act="import" data-trida="' + id + '">+ Přidat žáky</button>' +
          '<button class="btn small" data-act="trida-prejm" data-trida="' + id + '"' + (t.pending ? " disabled" : "") + '>Přejmenovat</button>' : "") +
        (moze("mazani") && !t.pending && d.tridy.length > 1 ? '<button class="btn small" data-act="trida-archivovat" data-trida="' + id + '" title="Třída se schová z běžné práce, nic se nesmaže. Jde obnovit.">Archivovat třídu…</button>' : "") +
        (t.pending ? "" : '<a class="btn small right" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer" title="Otevřít list třídy v Google Tabulkách">Otevřít v tabulce</a>') + "</div>";
      if (!t.zaci || !t.zaci.length) {
        h += '<div class="card empty">Třída je zatím prázdná. ' +
          (zapis ? '<button class="linkbtn" data-act="import" data-trida="' + id + '">Přidat žáky vložením tabulky</button>' : "") + "</div>";
      } else {
        if (zapis) {
          h += '<div class="selbar"><label><input type="checkbox" class="z-all" data-trida="' + id + '" aria-label="Vybrat všechny žáky třídy ' + esc(t.nazev) + '"> Vybrat všechny</label>' +
            '<span class="meta z-pocet">Nikdo nevybrán</span>' +
            '<button class="btn small danger right" data-act="zaci-odstranit" data-trida="' + id + '" disabled>Odstranit vybrané…</button>' +
            '<button class="btn small" data-act="zaci-presunout" data-trida="' + id + '" disabled>Přesunout vybrané…</button></div>';
        }
        h += '<div class="tablewrap"><table class="tbl"><thead><tr>' + (zapis ? '<th class="sel"></th>' : "") + "<th>Žák</th><th>E-mail</th><th>E-mail rodiče</th><th>VS</th></tr></thead><tbody>";
        t.zaci.forEach(function (z) {
          var hled = (z.prijmeni + " " + z.jmeno + " " + z.email + " " + (z.emailRodice || "") + " " + z.vs).toLowerCase();
          h += '<tr class="zakrad' + (z.pending ? " pending" : "") + '" data-hled="' + esc(hled) + '" data-radek="' + z.radek + '">' +
            (zapis ? (z.pending ? '<td class="sel"></td>' : '<td class="sel"><input type="checkbox" class="z-chk" data-trida="' + id + '" data-radek="' + z.radek + '" data-p="' + esc(z.prijmeni) + '" data-j="' + esc(z.jmeno) + '" aria-label="Vybrat: ' + esc(z.prijmeni + " " + z.jmeno) + '"></td>') : "") +
            "<td><b>" + esc(z.prijmeni) + "</b> " + esc(z.jmeno) + (z.pending ? ' <span class="zapisspin" title="Zapisuje se do tabulky…"></span>' : "") + "</td>" +
            '<td data-l="E-mail">' + (z.email ? esc(z.email) : '<span class="chip bez">bez e-mailu</span>') + "</td>" +
            '<td data-l="Rodič"' + (z.emailRodice ? "" : ' class="hide-m"') + ">" + (z.emailRodice ? esc(z.emailRodice) : '<span class="meta">—</span>') + "</td>" +
            '<td data-l="VS">' + (z.vs ? esc(z.vs) : '<span class="chip bez">bez VS</span>') + "</td></tr>";
        });
        h += "</tbody></table></div>";
      }
      h += "</div></details></section>";
    });
    h += '<p class="hint" id="zbez" hidden>Nikdo neodpovídá hledání.</p>' + archivHtml(arch);
    app.innerHTML = h;
    var dets = app.querySelectorAll("details.tcls:not(.archivsekce)");
    var da = $("archiv-sekce"); if (da) da.addEventListener("toggle", function () { S.archivOtevren = da.open; });
    for (var i = 0; i < dets.length; i++) {
      dets[i].addEventListener("toggle", function (ev) {
        if (S.hledaniZaku.trim()) return;          // během hledání se rozbalení řídí výsledky
        var tid = ev.target.getAttribute("data-trida");
        if (ev.target.open !== trOtevrena(tid)) S.otevrene[tid] = ev.target.open;       // zapamatuje se jen to, co uživatel sám změnil
      });
    }
    filtrujZaky(S.hledaniZaku);
  }

  // Archivované třídy: jen pro čtení. Obnovit jde kdykoli, smazat nadobro jen odtud (s názvem a heslem).
  function archivHtml(arch) {
    if (!arch || !arch.length) return "";
    var mazani = moze("mazani");
    var h = '<details class="tcls archivsekce" id="archiv-sekce"' + (S.archivOtevren ? " open" : "") + '><summary><h2>Archiv</h2><span class="meta">' + arch.length + " " + sklon(arch.length, "třída", "třídy", "tříd") +
      " · jen pro čtení</span></summary><div class=\"tbody\">" +
      '<p class="meta">Archivované třídy se nepoužívají při práci (nové sbírky, kontrola plateb, e-maily), ale <b>jejich žáci a záznamy proběhlých sbírek zůstávají</b> – uvidíte je v přehledu sbírek s označením Archiv a rodiče dál vidí své platby. ' +
      (mazani ? "Třídu můžete obnovit, nebo (po zadání jejího názvu a vašeho hesla) smazat nadobro – tím zmizí i záznamy jejích sbírek." : "") + "</p>";
    arch.forEach(function (t) {
      h += '<div class="acct"><div class="nm"><b>' + esc(t.nazev) + '</b> <span class="chip archiv">Archiv</span><div class="meta">' + t.pocetZaku + " " + sklon(t.pocetZaku, "žák", "žáci", "žáků") + " · " +
        t.pocetSbirek + " " + sklon(t.pocetSbirek, "sbírka", "sbírky", "sbírek") + "</div></div><div class=\"ctl\">" +
        (t.pocetSbirek ? '<button class="btn small" data-go="prehled" title="Sbírky archivních tříd najdete v přehledu sbírek">Sbírky</button>' : "") +
        (mazani ? '<button class="btn small primary" data-act="trida-obnovit" data-trida="' + t.id + '">Obnovit</button>' +
          '<button class="btn small danger" data-act="trida-smazat" data-trida="' + t.id + '">Smazat nadobro…</button>' : "") +
        '<a class="btn small" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer" title="Otevřít list třídy v Google Tabulkách">Otevřít v tabulce</a></div></div>';
    });
    return h + "</div></details>";
  }

  function filtrujZaky(q) {
    q = String(q || "").toLowerCase().trim();
    var sekce = document.querySelectorAll("section.tridasekce"), videt = 0;
    for (var s = 0; s < sekce.length; s++) {
      var radky = sekce[s].querySelectorAll("tbody tr[data-hled]"), n = 0;
      for (var i = 0; i < radky.length; i++) {
        var ok = !q || radky[i].getAttribute("data-hled").indexOf(q) !== -1;
        radky[i].hidden = !ok;
        if (ok) n++;
      }
      videt += n;
      var det = sekce[s].querySelector("details.tcls"), id = sekce[s].getAttribute("data-trida");
      if (q) { sekce[s].hidden = !n; if (det) det.open = n > 0; }
      else { sekce[s].hidden = false; if (det) det.open = trOtevrena(id); }
      obnovVyber(id);
    }
    var bez = $("zbez"); if (bez) bez.hidden = !(q && !videt);
  }

  // --- výběr žáků ve třídě (zaškrtávací políčka)
  function vybraniVTride(tid) {
    var out = [], els = document.querySelectorAll('.z-chk[data-trida="' + tid + '"]');
    for (var i = 0; i < els.length; i++) {

    else if (u.stav === "ceka_overeni") ctl = '<button class="btn small danger" data-act="ucet-odebrat" data-j="' + j + '">Odebrat…</button>';
    else if (u.stav === "zablokovan") ctl = '<button class="btn small" data-act="ucet-odblokovat" data-j="' + j + '">Odblokovat</button><button class="btn small danger" data-act="ucet-odebrat" data-j="' + j + '">Odebrat…</button>';
    else ctl = roleSel + (u.profil || u.role !== "zak" ? '<button class="btn small" data-act="ucet-profil" data-j="' + j + '">Profil…</button>' : "") +
      (ja ? "" : '<button class="btn small" data-act="ucet-blokovat" data-j="' + j + '">Zablokovat</button><button class="btn small danger" data-act="ucet-odebrat" data-j="' + j + '">Odebrat…</button>');
    var kdy = u.posledni ? " · naposledy přihlášen/a " + dt(u.posledni) : (u.pozvan && u.stav === "aktivni" ? " · pozvánku zatím nepoužil/a" : "");
    return '<div class="acct" data-j="' + j + '" data-hled="' + esc(((u.zobrazit || "") + " " + (u.email || u.jmeno) + " " + nazevRole(u.role)).toLowerCase()) + '"><div class="nm"><b>' + esc(u.zobrazit || u.jmeno) + "</b> " + (ja ? '<span class="meta">(vy)</span> ' : "") +
      '<span class="chip ' + esc(u.stav) + '">' + esc(STAVY_UCTU[u.stav] || u.stav) + "</span>" + (u.role ? ' <span class="chip typ">' + esc(nazevRole(u.role)) + "</span>" : "") +
      (u.pozvan ? ' <span class="chip typ">pozvaný/á</span>' : "") + (u.bezPrihlaseni ? ' <span class="chip zablokovan" title="Účet nemá e-mail, přihlásit se nemůže">bez přihlášení</span>' : "") +
      '<div class="meta">' + esc(u.email || u.jmeno) + (u.profil && u.profil.iban ? " · účet " + esc(ucetZobraz({ iban: u.profil.iban, ibanCislo: ibanNaCisloUctu(u.profil.iban) })) : (u.role === "ucitel" ? " · účet správce" : (u.profil ? "" : (u.role === "zak" || jeVl ? "" : " · bez vlastního profilu")))) +
      (u.lisiSe ? ' · <b style="color:var(--bad)">jiný účet než správce – banka musí posílat oznámení na ' + esc((S.ucty && S.ucty.mailbox) || "adresu aplikace") + "</b>" : "") +
      (u.role === "skolni_admin" && !u.bezPrihlaseni ? (u.maHeslo ? " · heslo nastaveno" : " · heslo si nastaví při prvním přihlášení") : "") + esc(kdy) + "</div>" +
      (u.bezPrihlaseni ? '<div class="meta" style="color:var(--bad)">Starý účet s přihlašovacím jménem – ke jménu a heslu se už nejde přihlásit. Odeberte ho a pozvěte tuto osobu e-mailem.</div>' : "") + "</div>" + '<div class="ctl">' + ctl + "</div></div>";
  }

  // Účty seřazené do skupin, ať se v nich správce vyzná: nejdřív co čeká na vyřízení, pak podle role.
  var SKUPINY_UCTU = [
    { id: "ceka", nazev: "Čekají na schválení", f: function (u) { return u.stav === "ceka"; } },
    { id: "overeni", nazev: "Nedokončená registrace (e-mail neověřen)", f: function (u) { return u.stav === "ceka_overeni"; } },
    { id: "vlastnik", nazev: "Vlastník", f: function (u) { return u.stav === "aktivni" && u.role === "vlastnik"; } },
    { id: "admin", nazev: "Školní admini", f: function (u) { return u.stav === "aktivni" && u.role === "skolni_admin"; } },
    { id: "ucitel", nazev: "Učitelé", f: function (u) { return u.stav === "aktivni" && u.role === "ucitel"; } },
    { id: "zak", nazev: "Žáci a rodiče", f: function (u) { return u.stav === "aktivni" && u.role === "zak"; } },
    { id: "blok", nazev: "Zablokované", f: function (u) { return u.stav === "zablokovan"; } }
  ];

  // ---- Seznam účtů: hledání, filtry, řazení a stránkování (pro stovky účtů)
  var UF = { q: "", stav: "", role: "", razeni: "skupiny", limit: {} };
  var UCTY_STRANKA = 50;
  var RAZENI_UCTU = [
    ["skupiny", "Podle skupin (výchozí)"], ["jmeno", "Jméno A–Z"], ["jmeno-z", "Jméno Z–A"], ["email", "E-mail A–Z"], ["role", "Role"],
    ["nove", "Nejnovější registrace"], ["stare", "Nejstarší registrace"], ["prihlasen", "Naposledy přihlášení"], ["neprihlasen", "Dlouho nepřihlášení"]
  ];

  function ucetCmp(razeni) {
    function txt(x) { return String(x || "").toLocaleLowerCase("cs"); }
    function cs(x, y) { return txt(x).localeCompare(txt(y), "cs", { numeric: true }); }
    function datum(x) { return x ? Date.parse(x) || 0 : 0; }
    var pole = {
      jmeno: function (x, y) { return cs(x.zobrazit || x.jmeno, y.zobrazit || y.jmeno); },
      "jmeno-z": function (x, y) { return cs(y.zobrazit || y.jmeno, x.zobrazit || x.jmeno); },
      email: function (x, y) { return cs(x.email || x.jmeno, y.email || y.jmeno); },
      role: function (x, y) { return ROLE_PRIRADIT.concat("vlastnik").indexOf(y.role) - ROLE_PRIRADIT.concat("vlastnik").indexOf(x.role); },
      nove: function (x, y) { return datum(y.vytvoreno) - datum(x.vytvoreno); },
      stare: function (x, y) { return datum(x.vytvoreno) - datum(y.vytvoreno); },
      prihlasen: function (x, y) { return datum(y.posledni) - datum(x.posledni); },
      neprihlasen: function (x, y) {            // kdo se nikdy nepřihlásil, je úplně první
        var dx = datum(x.posledni), dy = datum(y.posledni);
        return dx - dy;
      }
    };
    var f = pole[razeni] || pole.jmeno;
    return function (x, y) { return f(x, y) || cs(x.zobrazit || x.jmeno, y.zobrazit || y.jmeno) || cs(x.email || x.jmeno, y.email || y.jmeno); };
  }

  function ucetPasuje(u) {
    if (UF.stav && u.stav !== UF.stav) return false;
    if (UF.role && u.role !== UF.role) return false;
    if (!UF.q) return true;
    var hay = (u.zobrazit + " " + (u.email || "") + " " + u.jmeno + " " + nazevRole(u.role) + " " + (STAVY_UCTU[u.stav] || "") + " " + (u.pozval || "") + " " + (u.schvalil || "")).toLocaleLowerCase("cs");
    var hay2 = hay.normalize ? hay.normalize("NFD").replace(/[\u0300-\u036f]/g, "") : hay;     // hledání funguje i bez diakritiky
    return UF.q.split(/\s+/).every(function (t) { return !t || hay.indexOf(t) !== -1 || hay2.indexOf(t) !== -1; });
  }

  function skupinaUctuHtml(id, nazev, m, celkem, plocha) {
    var lim = UF.limit[id] || UCTY_STRANKA, ukaz = m.slice(0, lim);
    var h = '<div class="ugroup" data-g="' + id + '">' + (nazev ? "<h3>" + esc(nazev) + ' <span class="meta">(' + m.length + (m.length !== celkem ? " z " + celkem : "") + ")</span></h3>" : "") + ukaz.map(ucetRadek).join("");
    if (m.length > ukaz.length) {
      h += '<div class="row" style="justify-content:center;margin:10px 0 0"><button class="btn small" data-act="u-vic" data-g="' + id + '">Zobrazit dalších ' + Math.min(UCTY_STRANKA, m.length - ukaz.length) +
        ' <span class="meta">(zbývá ' + (m.length - ukaz.length) + ")</span></button></div>";
    }
    return h + "</div>";
  }

  // Vykreslí jen samotný seznam (hledání tak neztratí kurzor).
  function vykresliUcty() {
    var box = $("u-list"); if (!box || !S.ucty) return;
    var vse = S.ucty.ucty, m = vse.filter(ucetPasuje), h = "";
    var filtruje = !!(UF.q || UF.stav || UF.role);
    if (!m.length) h = '<div class="empty">' + (vse.length ? "Žádný účet neodpovídá hledání nebo filtru." : "Zatím žádné účty.") + "</div>";
    else if (UF.razeni === "skupiny") {
      SKUPINY_UCTU.forEach(function (g) {
        var celkem = vse.filter(g.f).length, mm = m.filter(g.f).sort(ucetCmp("jmeno"));
        if (mm.length) h += skupinaUctuHtml(g.id, g.nazev, mm, celkem);
      });
    } else {
      h = skupinaUctuHtml("vse", "", m.slice().sort(ucetCmp(UF.razeni)), vse.length);
    }
    box.innerHTML = '<div class="meta" style="margin:10px 0 0" aria-live="polite">' + (filtruje ? "Zobrazeno " + m.length + " z " + vse.length + " účtů." : "Celkem " + vse.length + " " + sklon(vse.length, "účet", "účty", "účtů") + ".") + "</div>" + h;
  }

  function seznamUctu(seznam) {

    seznam.forEach(function (u) { pocty[u.stav] = (pocty[u.stav] || 0) + 1; });
    var chips = [["", "Vše", seznam.length], ["ceka", "Čekají na schválení", pocty.ceka || 0], ["aktivni", "Schválení", pocty.aktivni || 0],
      ["ceka_overeni", "E-mail neověřen", pocty.ceka_overeni || 0], ["zablokovan", "Zablokovaní", pocty.zablokovan || 0]].filter(function (c) { return c[0] === "" || c[2] > 0; });
    var h = '<div class="utools">' +
      '<input type="search" id="u-hled" placeholder="Hledat: jméno, e-mail, role…" aria-label="Hledat účet" value="' + esc(UF.q) + '" autocomplete="off">' +
      '<div class="urow"><label class="meta">Role <select id="u-role" aria-label="Filtr podle role"><option value="">Všechny</option>' +
      ROLE_PRIRADIT.map(function (r) { return '<option value="' + r + '"' + (UF.role === r ? " selected" : "") + ">" + esc(nazevRole(r)) + "</option>"; }).join("") + "</select></label>" +
      '<label class="meta">Řadit <select id="u-razeni" aria-label="Řazení účtů">' +
      RAZENI_UCTU.map(function (r) { return '<option value="' + r[0] + '"' + (UF.razeni === r[0] ? " selected" : "") + ">" + r[1] + "</option>"; }).join("") + "</select></label></div>" +
      '<div class="urow" role="group" aria-label="Filtr podle stavu">' + chips.map(function (c) {
        return '<button type="button" class="chipbtn' + (UF.stav === c[0] ? " on" : "") + '" data-act="u-stav" data-s="' + c[0] + '" aria-pressed="' + (UF.stav === c[0]) + '">' + esc(c[1]) + " (" + c[2] + ")</button>";
      }).join("") + "</div></div>" +
      '<div id="u-list"></div>';
    return h;
  }

  function ucetFiltrZmena(id, hodnota) {
    if (id === "u-hled") UF.q = String(hodnota || "").toLocaleLowerCase("cs").trim();
    else if (id === "u-role") UF.role = hodnota;
    else if (id === "u-razeni") UF.razeni = hodnota;

  // ---- Pozvánky učitelů (náhled → potvrzení → odeslání)
  var PZ = null;

        "<b>Nejdřív uvidíte náhled; bez vašeho potvrzení se nic neodešle.</b></p>" +

  }
  function pozvankaNahled() {

    if (!PZ.emaily.trim()) { toast("Napište aspoň jednu e-mailovou adresu.", true); return; }

  function pozvankaOdeslat() {
    var h = PZ.nahled.vyzadujeHeslo ? ($("pz-heslo") ? $("pz-heslo").value : "") : undefined;

    });
  }

  // ---- Schránky: přehled „odkud a kam“ + nastavení všeho, co jde změnit

      "<tr><th>Přihlašovací kódy a upozornění odcházejí přes</th><td><b>" + esc(ky.pres === "gmail" ? "Gmail (" + mb + ")" : (ky.pres + (ky.odesilatel ? " (" + ky.odesilatel + ")" : ""))) + "</b></td></tr>" +
      "<tr><th>Bankovní oznámení o platbách aplikace čte ze schránky</th><td><b>" + esc(mb) + "</b></td></tr>" +
      "<tr><th>Banka je posílá na</th><td><b>" + esc(ban.adresa || "neuvedeno") + "</b> " + (ban.shoda ? '<span class="chip aktivni">souhlasí</span>' : '<span class="chip ceka">nesouhlasí se schránkou aplikace</span>') + "</td></tr>" +

        ", nebo aplikaci nasaďte z účtu " + esc(ban.adresa) + " (návod níže). Pak v Nastavení → Banka stiskněte „Ověřit napojení na banku“.</div>";
    }

    odznak(S.ucty.ucty.filter(function (x) { return x.stav === "ceka"; }).length);

  // Změna se v seznamu ukáže OKAMŽITĚ, server ji dostane na pozadí; když ji odmítne, seznam se vrátí podle serveru.
  function uctyZmenitOdeslat(args, zprava) {
    var u = ucetPodleJmena(args.jmeno);
    if (u) {
      if (args.role !== undefined) { u.role = args.role; u.typ = args.role; u.roleNazev = nazevRole(args.role); }
      if (args.stav !== undefined) u.stav = args.stav;
      prekresliNastaveni();

    if (zprava) toast(zprava);
    return bg(function () { return api("uctyZmenit", args); }).then(function (n) {
      if (n && S.ucty) S.ucty.ucty = S.ucty.ucty.map(function (x) { return x.jmeno === n.jmeno ? n : x; });
      prekresliNastaveni();
      if (n && n.schvaleniEmail === "odeslan") toast("E-mail o dokončení registrace odešel na " + (n.email || n.jmeno) + ".");
      else if (n && n.schvaleniEmail === "chyba") toast("Účet je schválený, ale e-mail o tom se nepodařilo odeslat (" + (n.schvaleniChyba || "neznámá chyba") + "). Dejte uživateli vědět sami.", true);
    }).catch(function (e) { chyba(e); return nactiUcty().catch(function () {}); });

  // Změna účtu. Kdykoli by vznikl nebo zanikl školní admin (povýšení, snížení, zablokování, odblokování, schválení rovnou jako admin),
  // vyžaduje server vlastní heslo přihlášeného správce – to tu zjistíme předem a ukážeme okno pro heslo. Server to ověřuje sám.
  function uctyZmenit(args, zprava) {
    var u = ucetPodleJmena(args.jmeno);
    var bylo = u ? jeAktivniAdmin(u.role, u.stav) : false;
    var bude = u ? jeAktivniAdmin(args.role !== undefined ? args.role : u.role, args.stav !== undefined ? args.stav : u.stav) : false;
    if (!u || bylo === bude) return uctyZmenitOdeslat(args, zprava);
    var kdo = esc(u.zobrazit || u.jmeno), nadpis, telo, tl;

  // bez ní se stránka přepne okamžitě na kostru a data doplní, jakmile dorazí. Nic nezamyká obrazovku.

  // Nepřekreslujeme pod rukama: ne když je otevřené okno nebo uživatel právě píše do pole.

    return true;

  function nacti(o) {
    var my = ++NAV, obnovit = FORCE, wv = WRITEV, ov = OPTV;

    if (stary !== undefined) {
      try { o.nastav(JSON.parse(stary), false); setView(o.pohled); o.vykresli(); zobrazeno = true; } catch (e0) { zobrazeno = false; }
    }
    if (!zobrazeno) { setView(o.pohled); app.innerHTML = kostra(o.text); }
    else if (!obnovit && (Date.now() - (SWT[o.klic] || 0) < 20000 || BGN > 0)) return Promise.resolve();     // data jsou čerstvá (nebo se právě zapisuje): na server se nevolá

  // Po prvním zobrazení (a po každé změně) se na pozadí předčte VŠECHNO najednou jedním dotazem: přehled, žáci, historie, detail
  // každé sbírky, moje platby, informace i nastavení. Přepínání mezi stránkami pak nečeká na server.
  function ulozVse(d) {
    function dej(k, v) { if (v !== undefined && v !== null) { SW[k] = JSON.stringify(v); SWT[k] = Date.now(); } }
    dej("prehled", d.prehled); dej("zaci", d.zaci); dej("historie", d.historie);

  function predNactiVse(obnovit) {

      VSE_BEZI = null;

  }
  function planVse() {
    clearTimeout(VSE_T);

  // ---------- Okamžitá změna na obrazovce, zápis do tabulky doběhne na pozadí ----------
  var TMPN = 0, TMPTRIDA = 0, MAPA_TRID = {};
  var OPTV = 0;             // roste při každé místní (zatím nezapsané) změně: načtení ze serveru, které začalo dřív, ji nesmí přepsat
  function zaokr(x) { return Math.round(x * 100) / 100; }
  function ulozSW(klic, data) { SW[klic] = JSON.stringify(data); SWT[klic] = 0; OPTV++; }       // 0 = zastaralé: při příští návštěvě se obnoví
  function skutecneIdTridy(id) { return Object.prototype.hasOwnProperty.call(MAPA_TRID, id) ? MAPA_TRID[id] : id; }
  function klicDetailu(d) { return d.skupina ? "skup:" + d.skupina.id : "detail:" + d.sbirka.colIndex + ":" + d.sbirka.tridaId; }
  function prekresliAktualni() {

  // Stav žáka podle zaplacené a očekávané částky (stejně jako na serveru).
  function prepoctiStav(z) {
    if (z.stav === "nic" || z.stav === "rucne" || !(z.ocekavano > 0)) return;
    if (z.zaplaceno <= 0) z.stav = "nezaplaceno";
    else if (z.zaplaceno > z.ocekavano + 0.004) z.stav = "preplatek";
    else if (z.zaplaceno >= z.ocekavano - 0.004) z.stav = "zaplaceno";
    else z.stav = "castecne";
  }
  function prepoctiEmailStav(z) {
    var moze_ = (/@/.test(z.email || "") || z.maRodice) && String(z.vs || "") !== "";
    if (z.qrPocet > 0) z.emailStav = "odeslano";
    else if (z.stav === "nezaplaceno" && moze_) z.emailStav = "neodeslano";
    else if ((z.stav === "nezaplaceno" || z.stav === "castecne") && !moze_) z.emailStav = "bez";
    else z.emailStav = "";
  }
  function souhrnZ(studenti) {
    var pocty = { zaplaceno: 0, preplatek: 0, castecne: 0, nezaplaceno: 0, rucne: 0, nic: 0 };
    var so = { ocekavano: 0, vybrano: 0, pocetOcekavano: 0, pocetZaplaceno: 0, upravenoRucne: 0, vse: false };
    var em = { odeslano: 0, neodeslano: 0, bez: 0, pripominky: 0 };
    studenti.forEach(function (z) {
      pocty[z.stav] = (pocty[z.stav] || 0) + 1;
      if (z.stav !== "nic" && z.ocekavano > 0) {
        so.pocetOcekavano++; so.ocekavano += z.ocekavano; so.vybrano += z.zaplaceno;
        if (z.stav === "zaplaceno" || z.stav === "preplatek") so.pocetZaplaceno++;
        if (z.upravenoRucne) so.upravenoRucne++;
      }
      if (z.emailStav === "odeslano") em.odeslano++; else if (z.emailStav === "neodeslano") em.neodeslano++; else if (z.emailStav === "bez") em.bez++;
      if (z.pripPocet > 0) em.pripominky++;
    });
    so.ocekavano = zaokr(so.ocekavano); so.vybrano = zaokr(so.vybrano);
    so.vse = so.pocetOcekavano > 0 && so.pocetZaplaceno === so.pocetOcekavano;
    return { pocty: pocty, souhrn: so, emaily: em };
  }
  // Po místní změně žáka přepočítá souhrny detailu (i částí sbírky ve více třídách) a karty v přehledu.
  function prepoctiDetail(d) {
    var v = souhrnZ(d.studenti);
    d.pocty = v.pocty; d.souhrn = v.souhrn; d.emaily = v.emaily;
    var casti = [];
    if (d.skupina) {
      d.skupina.casti.forEach(function (c) {
        var m = souhrnZ(d.studenti.filter(function (z) { return String(z.tridaId) === String(c.tridaId); }));
        c.souhrn = m.souhrn; c.pocty = m.pocty; c.emaily = m.emaily; casti.push(c);
      });
    } else casti.push({ tridaId: d.sbirka.tridaId, specSymbol: d.sbirka.specSymbol, colIndex: d.sbirka.colIndex, souhrn: d.souhrn, pocty: d.pocty, emaily: d.emaily });
    var pr = S.prehled;
    if (pr) {
      function zapis(s) {
        casti.forEach(function (c) {
          if (String(s.tridaId) === String(c.tridaId) && s.specSymbol === c.specSymbol) { s.souhrn = c.souhrn; s.pocty = c.pocty; s.emaily = c.emaily; }
        });
      }
      pr.sbirky.forEach(zapis);
      pr.tridy.forEach(function (t) { t.sbirky.forEach(zapis); });
      (pr.skupiny || []).forEach(function (g) {
        var tyka = g.casti.some(function (gc) { return casti.some(function (c) { return String(gc.tridaId) === String(c.tridaId) && gc.specSymbol === c.specSymbol; }); });
        if (!tyka) return;
        g.casti.forEach(function (gc) { casti.forEach(function (c) { if (String(gc.tridaId) === String(c.tridaId) && gc.specSymbol === c.specSymbol) gc.souhrn = c.souhrn; }); });
        var sou = { ocekavano: 0, vybrano: 0, pocetOcekavano: 0, pocetZaplaceno: 0, upravenoRucne: 0 };
        g.casti.forEach(function (gc) { for (var k in sou) sou[k] += gc.souhrn[k] || 0; });
        sou.ocekavano = zaokr(sou.ocekavano); sou.vybrano = zaokr(sou.vybrano); sou.vse = sou.pocetOcekavano > 0 && sou.pocetZaplaceno === sou.pocetOcekavano;
        g.souhrn = sou;
      });
      ulozSW("prehled", pr);
    }

  // Hotový zápis jednoho žáka: jeho štítek se změní z tmavě zeleného „zapisuje se“ na běžný, ostatní žáci, kteří se ještě zapisují, zůstanou beze změny.

  // Změny, které se dokončí na pozadí (jedna po druhé, aby se neprohodilo pořadí): obrazovka se nezamyká.
  var BGQ = Promise.resolve(), BGN = 0;
