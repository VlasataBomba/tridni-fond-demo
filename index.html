      case "ucet-odebrat": {
        var jO = a.getAttribute("data-j"), uO = ucetPodleJmena(jO);
        var teloO = '<div class="notice bad"><b>Zatím se nic nestalo.</b> Účet <b>' + esc(ucetNazev(jO)) + "</b> (" + esc(jO) + ") se po potvrzení smaže a uživatel se okamžitě odhlásí. " +
          "Sbírky a platby se nemažou. Uživatel se může znovu zaregistrovat.</div>";
        if (uO && uO.role === "skolni_admin") {
          oknoSHeslem({
            nadpis: "Odebrat školního admina?", telo: teloO, tlacitko: "Odebrat účet",
            akce: function (heslo) { return api("uctyOdebrat", { jmeno: jO, heslo: heslo }); },
            hotovo: function () { toast("Účet odebrán."); return nactiUcty(); }
          });
          break;
        }
        potvrdit("Odebrat účet?", teloO, "Odebrat účet", function () {
          closeModal();
          if (S.ucty) { S.ucty.ucty = S.ucty.ucty.filter(function (x) { return x.jmeno !== jO; }); prekresliNastaveni(); }
          toast("Odebírám účet…");
          bg(function () { return api("uctyOdebrat", { jmeno: jO }); }).then(function () { toast("Účet odebrán."); }).catch(function (e) { chyba(e); return nactiUcty().catch(noop); });
        });
        break;
      }
      case "import": modalImport(Number(a.getAttribute("data-trida"))); break;
      case "import-poslat": importPoslat(); break;
      case "i-smaz": if (I) { I.radky.splice(Number(a.getAttribute("data-r")), 1); renderMrizku(); } break;
      case "zprava": modalZprava(a.getAttribute("data-id")); break;
      case "o-nove": {
        obnovRadkyOdeslani(true);
        break;
      }
      case "nova-ulozit": novaUlozit(); break;
      case "pick-vsem": pickHromadne("vsem"); break;
      case "pick-vybranym": pickHromadne("vybranym"); break;
      case "pick-nikdo": pickHromadne("nikdo"); break;
      case "pick-tvsem": pickHromadne("vsem", Number(a.getAttribute("data-trida"))); break;
      case "pick-tvybranym": pickHromadne("vybranym", Number(a.getAttribute("data-trida"))); break;
      case "pick-tnikdo": pickHromadne("nikdo", Number(a.getAttribute("data-trida"))); break;
      case "detail": S.kontrola = null; nactiDetail(Number(a.getAttribute("data-col")), Number(a.getAttribute("data-trida"))); break;
      case "kontrola": kontrola(); break;
      case "nahled": nahled(a.getAttribute("data-typ")); break;
      case "odeslat": odeslat(); break;
      case "zavrit": odeslani = null; closeModal(); break;
      case "filtr": S.filtr = a.getAttribute("data-f"); renderDetail(); break;
      case "menu-zak": {
        var r = a.getBoundingClientRect(), klicR = trId + ":" + radek;
        var otevrena = !$("ctx").hidden && $("ctx").getAttribute("data-radek") === klicR;
        if (otevrena) { zavriNabidku(); break; }
        ukazNabidku(radek, trId, r.right - 250, r.bottom + 4);
        $("ctx").setAttribute("data-radek", klicR);
        break;
      }
      case "zak-zaplaceno": modalRucni(radek, trId, "zaplaceno"); break;
      case "zak-castka": modalRucni(radek, trId, "castka"); break;
      case "zak-rucni": modalRucni(radek, trId, "castka"); break;
      case "zak-ucast": modalUcast(radek, trId); break;
      case "m-doplatit": rucniUlozit(true); break;
      case "m-ulozit": rucniUlozit(false); break;
      case "m-smazat":
        if (!a.classList.contains("sure")) {          // dvoukrokové mazání (bez confirm(), který v zabaleném okně nemusí fungovat)
          a.classList.add("sure"); a.textContent = "Opravdu smazat";
          setTimeout(function () { if (a.isConnected) { a.classList.remove("sure"); a.textContent = "Smazat"; } }, 5000);
        } else {
          rucniSmazat(a.getAttribute("data-id"), M ? M.radek : 0, M ? M.tridaId : 0);
        }
        break;
      case "u-ulozit": ucastUloz(false); break;
      case "u-vyradit": ucastUloz(true); break;
      case "odkazy":
        run("Opravuji odkazy…", api("opravOdkazy")).then(function (r) { toast("Odkazy opraveny: " + r.opraveno + " řádků."); }).catch(chyba);
        break;
    }
  });

  document.addEventListener("contextmenu", function (ev) {
    var tr = ev.target.closest && ev.target.closest("tr.zak");
    if (!tr || S.view !== "detail" || !moze("zapis") || tr.getAttribute("data-archiv")) return;
    ev.preventDefault();
    var radek = Number(tr.getAttribute("data-radek")), tridaId = Number(tr.getAttribute("data-trida"));
    ukazNabidku(radek, tridaId, ev.clientX, ev.clientY);
    $("ctx").setAttribute("data-radek", tridaId + ":" + radek);
  });

  document.addEventListener("toggle", function (ev) {
    var t = ev.target;
    if (t && t.classList && t.classList.contains("nsek")) { S.nsek = S.nsek || {}; S.nsek[t.getAttribute("data-sek")] = t.open; }
  }, true);

  document.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (ev.target.id === "h-form") hesloUloz();
    else if (ev.target.id === "t-form") tridaUloz();
    else if (ev.target.id === "lg-form") kodPoslat(false);
    else if (ev.target.id === "lk-form") prihlasitKodem();
    else if (ev.target.id === "la-form") prihlasitSpravce();
    else if (ev.target.id === "r-form") registrovat();
    else if (ev.target.id === "rk-form") registraceOverit();
    else if (ev.target.id === "dk1-form") diteKod(false);
    else if (ev.target.id === "dk2-form") diteOverit();
    else if (ev.target.id === "p-form") profilUlozit();
    else if (ev.target.id === "vp-form") vychoziUlozit();
    else if (ev.target.id === "up-form") profilUctuUlozit();
    else if (ev.target.id === "hp-form") hpOdeslat();
    else if (ev.target.id === "skola-form") skolaUloz();
    else if (ev.target.id === "pz-form") pozvankaNahled();
    else if (ev.target.id === "sch-form") schrankyUloz();
    else if (ev.target.id === "ez-form") emailPoslat();
    else if (ev.target.id === "ezk-form") emailPotvrdit();
    else if (ev.target.id === "mail-form") mailUloz();
    else if (ev.target.id === "banky-form") bankyUloz();
  });

  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.classList && t.classList.contains("p-castka")) { t.removeAttribute("aria-invalid"); var rowI = t.closest(".pick-row"); if (rowI) rowI.setAttribute("data-auto", ""); prepocitejPick(); }
    else if (t.id === "n-hled") pickHledej(t.value);
    else if (t.id === "u-hled") ucetFiltrZmena(t.id, t.value);
    else if (t.getAttribute && t.getAttribute("data-iban")) ibanHint(t);
    else if (t.id === "hp-opsat") hpAktualizuj();
    else if (t.id === "i-text") { clearTimeout(importCasovac); importCasovac = setTimeout(importZpracujText, 120); }
    else if (t.classList && t.classList.contains("i-bunka") && I) {
      I.radky[Number(t.getAttribute("data-r"))][Number(t.getAttribute("data-c"))] = t.value;
      obnovStavy();
    }
    else if (t.id === "zhled") { S.hledaniZaku = t.value; filtrujZaky(t.value); }
    else if (t.id === "m-castka" || t.id === "u-castka") t.removeAttribute("aria-invalid");
  });

  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id === "o-vse") {
      var els = document.querySelectorAll(".o-radek");
      for (var i = 0; i < els.length; i++) els[i].checked = t.checked && !els[i].disabled;
      prepocitejVyber();
    } else if (t.id === "o-cil-zak" || t.id === "o-cil-rodic") {
      obnovRadkyOdeslani(true);
    } else if (t.classList && t.classList.contains("o-radek")) {
      prepocitejVyber();
    } else if (t.classList && t.classList.contains("i-map") && I) {
      I.mapovani[Number(t.getAttribute("data-c"))] = t.value;
      obnovStavy();
    } else if (t.id === "i-vs") {
      obnovStavy();
    } else if (t.classList && t.classList.contains("p-chk")) {
      var row = t.closest(".pick-row"), inp = row.querySelector(".p-castka");
      var hrom = castkaHromadne(Number(row.getAttribute("data-trida")));
      nastavRadek(row, t.checked, t.checked && !(cislo(inp.value) > 0) && hrom > 0 ? hrom : undefined);
      if (t.checked) inp.focus();
      prepocitejPick();
    } else if (t.classList && t.classList.contains("t-all")) {
      var tidA = Number(t.getAttribute("data-trida"));
      if (t.checked) vyberCelouTridu(tidA); else pickHromadne("nikdo", tidA);
    } else if (t.classList && t.classList.contains("t-hrom")) {
      var detH = t.closest("details.pick");
      if (detH) castkaTridyZmena(Number(detH.getAttribute("data-trida")), cislo(t.value));
    } else if (t.id === "u-role" || t.id === "u-razeni") {
      ucetFiltrZmena(t.id, t.value);
    } else if (/^[a-z]+-admin$/.test(t.id || "")) {
      bankaHint(t.id.replace(/-admin$/, ""));
    } else if (t.id === "r-typ") {
      L.typ = t.value; ukazPoleRegistrace();
    } else if (t.id === "mail-posk") {
      var ex = $("mail-ext"); if (ex) ex.hidden = t.value === "gmail";
    } else if (t.classList && t.classList.contains("z-chk")) {
      obnovVyber(t.getAttribute("data-trida"));
    } else if (t.classList && t.classList.contains("z-all")) {
      vyberVse(t.getAttribute("data-trida"), t.checked);
    } else if (t.classList && t.classList.contains("u-role")) {
      var rowU = t.closest(".acct"), jU = t.getAttribute("data-j");
      if (rowU && rowU.querySelector('[data-act="ucet-schvalit"]')) return;       // u čekajícího se role použije až při schválení
      uctyZmenit({ jmeno: jU, role: t.value }, "Role změněna na „" + nazevRole(t.value) + "“: " + ucetNazev(jU) + ".");
    } else if (t.getAttribute && t.getAttribute("data-set")) {
      var klic = t.getAttribute("data-set"), val = t.checked;
      run("Ukládám nastavení…", api("nastavit", { klic: klic, hodnota: val })).then(function (n) {
        S.nastaveni = n; renderNastaveni(); toast("Nastavení uloženo.");
      }).catch(function (e) { t.checked = !val; chyba(e); });
    }
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape") return;
    if (!$("ctx").hidden) { zavriNabidku(); return; }
    if ($("modal-root").firstChild) { odeslani = null; closeModal(); }
  });
  window.addEventListener("scroll", zavriNabidkuPriPosunu, true);
  window.addEventListener("resize", zavriNabidku);

  start();
})();
</script>
</body>
</html>
