  }

  // Účty seřazené do skupin, ať se v nich správce vyzná: nejdřív co čeká na vyřízení, pak podle role.
  var SKUPINY_UCTU = [
    { id: "ceka", nazev: "Čekají na schválení", f: function (u) { return u.stav === "ceka"; } },
    { id: "overeni", nazev: "Nedokončená registrace (e-mail neověřen)", f: function (u) { return u.stav === "ceka_overeni"; } },
    { id: "vlastnik", nazev: "Vlastník", f: function (u) { return u.stav === "aktivni" && u.role === "vlastnik"; } },
    { id: "admin", nazev: "Školní admini", f: function (u) { return u.stav === "aktivni" && u.role === "skolni_admin"; } },
    { id: "ucitel", nazev: "Učitelé", f: function (u) { return u.stav === "aktivni" && u.role === "ucitel"; } },
    { id: "zak", nazev: "Žáci a rodiče", f: function (u) { return u.stav === "aktivni" && u.role === "zak"; } },
    { id: "blok", nazev: "Zablokované", f: function (u) { return u.stav === "zablokovan"; } }
  ];

  // ---- Seznam účtů: hledání, filtry, řazení a stránkování (pro stovky účtů)
  var UF = { q: "", stav: "", role: "", razeni: "skupiny", limit: {} };
  var UCTY_STRANKA = 50;
  var RAZENI_UCTU = [
    ["skupiny", "Podle skupin (výchozí)"], ["jmeno", "Jméno A–Z"], ["jmeno-z", "Jméno Z–A"], ["email", "E-mail A–Z"], ["role", "Role"],
    ["nove", "Nejnovější registrace"], ["stare", "Nejstarší registrace"], ["prihlasen", "Naposledy přihlášení"], ["neprihlasen", "Dlouho nepřihlášení"]
  ];

  function ucetCmp(razeni) {
    function txt(x) { return String(x || "").toLocaleLowerCase("cs"); }
    function cs(x, y) { return txt(x).localeCompare(txt(y), "cs", { numeric: true }); }
    function datum(x) { return x ? Date.parse(x) || 0 : 0; }
    var pole = {
      jmeno: function (x, y) { return cs(x.zobrazit || x.jmeno, y.zobrazit || y.jmeno); },
      "jmeno-z": function (x, y) { return cs(y.zobrazit || y.jmeno, x.zobrazit || x.jmeno); },
      email: function (x, y) { return cs(x.email || x.jmeno, y.email || y.jmeno); },
      role: function (x, y) { return ROLE_PRIRADIT.concat("vlastnik").indexOf(y.role) - ROLE_PRIRADIT.concat("vlastnik").indexOf(x.role); },
      nove: function (x, y) { return datum(y.vytvoreno) - datum(x.vytvoreno); },
      stare: function (x, y) { return datum(x.vytvoreno) - datum(y.vytvoreno); },
      prihlasen: function (x, y) { return datum(y.posledni) - datum(x.posledni); },
      neprihlasen: function (x, y) {            // kdo se nikdy nepřihlásil, je úplně první
        var dx = datum(x.posledni), dy = datum(y.posledni);
        return dx - dy;
      }
    };
    var f = pole[razeni] || pole.jmeno;
    return function (x, y) { return f(x, y) || cs(x.zobrazit || x.jmeno, y.zobrazit || y.jmeno) || cs(x.email || x.jmeno, y.email || y.jmeno); };
  }

  function ucetPasuje(u) {
    if (UF.stav && u.stav !== UF.stav) return false;
    if (UF.role && u.role !== UF.role) return false;
    if (!UF.q) return true;
    var hay = (u.zobrazit + " " + (u.email || "") + " " + u.jmeno + " " + nazevRole(u.role) + " " + (STAVY_UCTU[u.stav] || "") + " " + (u.pozval || "") + " " + (u.schvalil || "")).toLocaleLowerCase("cs");
    var hay2 = hay.normalize ? hay.normalize("NFD").replace(/[\u0300-\u036f]/g, "") : hay;     // hledání funguje i bez diakritiky

  }

  function skupinaUctuHtml(id, nazev, m, celkem, plocha) {

        ' <span class="meta">(zbývá ' + (m.length - ukaz.length) + ")</span></button></div>";

  // Vykreslí jen samotný seznam (hledání tak neztratí kurzor).
  function vykresliUcty() {
    var box = $("u-list"); if (!box || !S.ucty) return;
    var vse = S.ucty.ucty, m = vse.filter(ucetPasuje), h = "";
    var filtruje = !!(UF.q || UF.stav || UF.role);
    if (!m.length) h = '<div class="empty">' + (vse.length ? "Žádný účet neodpovídá hledání nebo filtru." : "Zatím žádné účty.") + "</div>";
    else if (UF.razeni === "skupiny") {
      SKUPINY_UCTU.forEach(function (g) {
        var celkem = vse.filter(g.f).length, mm = m.filter(g.f).sort(ucetCmp("jmeno"));
        if (mm.length) h += skupinaUctuHtml(g.id, g.nazev, mm, celkem);

  }

  function seznamUctu(seznam) {
    if (!seznam.length) return '<div class="empty">Zatím žádné účty.</div>';

  // ---- E-maily, škola, banka (jen s právem „nastavení“)
  function skolaUloz() {
    var v = ($("skola-nazev").value || "").trim(), id = ($("skola-id").value || "").trim(), ob = $("skola-obnovit");
    if (v.length < 2) { toast("Zadejte název školy (aspoň 2 znaky).", true); return; }
    run("Ukládám…", api("skolaUlozit", { nazev: v, id: id, obnovitVzhled: !!(ob && ob.checked) })).then(function (r) {
      S.skola = r.skola || v; hlavickaPrihlaseny(true); aplikujVzhled(r.vzhled);
      var vv = r.vzhledVysledek;
      if (vv && !vv.ok) toast("Škola uložena, ale vzhled z webu se nepodařilo načíst: " + vv.chyba, true);
      else toast("Škola uložena.");
      return api("nastaveni").then(function (n) { S.nastaveni = n; renderNastaveni(); });
    }).catch(chyba);
  }

  function mailUloz() {
    var posk = $("mail-posk").value, o = { poskytovatel: posk };
    if (posk !== "gmail") {
      o.odesilatel = ($("mail-od").value || "").trim().toLowerCase();
      o.jmeno = ($("mail-jm").value || "").trim();
      o.klic = ($("mail-klic").value || "").trim();
      var sm = $("mail-smaz"); if (sm && sm.checked) o.smazatKlic = true;
      if (!RE_MAIL1.test(o.odesilatel)) { toast("Zadejte e-mail odesílatele ověřený ve službě.", true); $("mail-od").focus(); return; }
    } else {
      var sm2 = $("mail-smaz"); if (sm2 && sm2.checked) o.smazatKlic = true;
    }
    run("Ukládám…", api("mailUlozit", o)).then(function (m) {
      S.mail = m; toast("Nastavení e-mailů uloženo."); renderNastaveni();
    }).catch(chyba);
  }

  function mailTest() {
    run("Posílám zkušební e-mail…", api("mailTest")).then(function (r) {
      toast("Zkušební e-mail odešel na " + r.komu + " (přes " + (r.pres === "gmail" ? "Gmail" : r.pres) + (r.zaloha ? " – záložně, služba selhala" : "") + "). Zkontrolujte schránku včetně Spamu.", !!r.zaloha);
      return api("mailStav").then(function (m) { S.mail = m; if (S.view === "nastaveni") renderNastaveni(); });

  // --- Vložení žáků z tabulky (copy-paste)
  var POLE = [
    ["", "— nepoužít —"], ["prijmeni", "Příjmení"], ["jmeno", "Jméno"], ["prijmeniJmeno", "Příjmení a jméno"],
    ["jmenoPrijmeni", "Jméno a příjmení"], ["email", "E-mail žáka"], ["emailRodice", "E-mail rodiče"], ["vs", "Variabilní symbol"]
  ];
  var MAX_IMPORT = 200;
  var RE_EMAIL = /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/;
  var I = null;   // { trida, zaci, vsJinde, radky:[[bunky]], mapovani:[pole], hlavicka, zkraceno }

  function bezDiakritiky(s) { return String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function normVsK(v) { return String(v || "").replace(/\s+/g, "").replace(/^0+/, ""); }
  function normJm(s) { return bezDiakritiky(s).toLowerCase().replace(/\s+/g, " ").trim(); }

  // Text z Excelu/Tabulek (tabulátory) nebo CSV (středník/čárka) -> pole řádků. Umí uvozovky.
  function rozdelVlozeny(text) {
    text = String(text).replace(/\r\n?/g, "\n").replace(/^﻿/, "");
    var odd = "\t";
    if (text.indexOf("\t") === -1) {
      var sred = (text.match(/;/g) || []).length, carka = (text.match(/,/g) || []).length;
      odd = sred > 0 && sred >= carka ? ";" : (carka > 0 ? "," : null);
    }
    var radky = [], radek = [], bunka = "", uv = false;
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (uv) {
        if (c === '"') { if (text.charAt(i + 1) === '"') { bunka += '"'; i++; } else uv = false; }
        else bunka += c;
      } else if (c === '"' && bunka === "") {
        uv = true;
      } else if (odd && c === odd) {
        radek.push(bunka); bunka = "";
      } else if (c === "\n") {
        radek.push(bunka); radky.push(radek); radek = []; bunka = "";
      } else {
        bunka += c;
      }
    }
    radek.push(bunka); radky.push(radek);
    return radky.map(function (r) { return r.map(function (x) { return x.replace(/\s+/g, " ").trim(); }); })
      .filter(function (r) { return r.some(function (x) { return x !== ""; }); });
  }

  // Slovo typické pro záhlaví sloupce (celá buňka, aby příjmení jako „Žáková“ nebo „Jmenovský“ záhlaví nespustilo)
  function jeSlovoHlavicky(c) {
    c = bezDiakritiky(c).toLowerCase().trim();
    return /^(prijmeni|jmeno|krestni jmeno)(\s*(a|\/|,)\s*(prijmeni|jmeno))?$/.test(c) ||
      /^(zak|zaci|student|studenti|name|surname|first name|last name)$/.test(c) ||
      /mail/.test(c) || /^variabiln/.test(c) || /^v\.? ?s\.?$/.test(c) || /^(castka|cena|kc)\b/.test(c);   // záhlaví „Částka“ se pozná, ale sloupec se nepoužije
  }
  function jeHlavicka(radek) {
    var ma = false;
    for (var i = 0; i < radek.length; i++) {
      var c = radek[i];
      if (c.indexOf("@") !== -1 || /^[0-9]+([.,][0-9]+)?$/.test(c)) return false;
      if (jeSlovoHlavicky(c)) ma = true;
    }
    return ma;
  }

  function poleZHlavicky(t) {
    t = bezDiakritiky(t).toLowerCase().trim();
    if (/prijmeni.*jmeno/.test(t)) return "prijmeniJmeno";
    if (/jmeno.*prijmeni/.test(t)) return "jmenoPrijmeni";
    if (/prijm|surname|last ?name|family/.test(t)) return "prijmeni";
    if (/^(jmeno|krestni|first ?name|given)/.test(t)) return "jmeno";
    if (/mail/.test(t) && /(rodic|zakonn|parent)/.test(t)) return "emailRodice";
    if (/mail/.test(t)) return "email";
    if (/variab|^vs$|^v\.? ?s\.?$/.test(t)) return "vs";
    if (/^(zak|zaci|student|jmeno|name)$/.test(t)) return "prijmeniJmeno";
    return "";
  }

  function uhodniMapovani(hlavicka, radky, sloupcu) {
    var map = [], c, r;
    for (c = 0; c < sloupcu; c++) map.push(hlavicka ? poleZHlavicky(hlavicka[c] || "") : "");
    var uzito = {};
    map.forEach(function (m, i) { if (m) { if (uzito[m]) map[i] = ""; else uzito[m] = true; } });
    // sloupce bez rozpoznané hlavičky se hádají podle obsahu
    var stat = [];
    for (c = 0; c < sloupcu; c++) {
      var neprazdnych = 0, maily = 0, cisla = 0, dvaSlova = 0, delka = 0;
      for (r = 0; r < radky.length; r++) {
        var v = (radky[r][c] || "").trim();
        if (!v) continue;
        neprazdnych++;
        if (RE_EMAIL.test(v.replace(/\s+/g, ""))) maily++;
        else if (/^[0-9][0-9 ]*$/.test(v)) { cisla++; delka += v.replace(/\s+/g, "").length; }
        else if (/\S+\s+\S+/.test(v)) dvaSlova++;
      }
      stat.push({ n: neprazdnych, maily: maily, cisla: cisla, dvaSlova: dvaSlova, delka: cisla ? delka / cisla : 0 });
    }
    function volne(c) { return !map[c]; }
    for (c = 0; c < sloupcu; c++) {
      if (!volne(c) || !stat[c].n || stat[c].maily / stat[c].n < 0.6) continue;
      if (!uzito.email) { map[c] = "email"; uzito.email = true; }
      else if (!uzito.emailRodice) { map[c] = "emailRodice"; uzito.emailRodice = true; }       // druhý sloupec s e-maily = rodiče
    }
    var ciselne = [];
    for (c = 0; c < sloupcu; c++) if (volne(c) && stat[c].n && stat[c].cisla / stat[c].n >= 0.6) ciselne.push(c);
    ciselne.sort(function (x, y) { return stat[y].delka - stat[x].delka; });
    ciselne.forEach(function (col) {
      if (!uzito.vs && stat[col].delka >= 6) { map[col] = "vs"; uzito.vs = true; }
    });
    var textove = [];
    for (c = 0; c < sloupcu; c++) if (volne(c) && stat[c].n && stat[c].maily / stat[c].n < 0.6 && stat[c].cisla / stat[c].n < 0.6) textove.push(c);
    if (!uzito.prijmeniJmeno && !uzito.jmenoPrijmeni && !uzito.prijmeni && !uzito.jmeno) {
      if (textove.length === 1) {
        var s0 = stat[textove[0]];
        map[textove[0]] = s0.dvaSlova / s0.n >= 0.6 ? "prijmeniJmeno" : "prijmeni";
      } else if (textove.length >= 2) {
        map[textove[0]] = "prijmeni"; map[textove[1]] = "jmeno";
      }
    }
    return map;
  }

  function normRadek(bunky, map) {
    var o = { prijmeni: "", jmeno: "", email: "", emailRodice: "", vs: "" };
    for (var i = 0; i < map.length; i++) {
      var pole = map[i], v = (bunky[i] || "").trim();
      if (!pole || !v) continue;
      var m;
      if (pole === "prijmeniJmeno") { m = v.split(/\s+/); if (!o.prijmeni) o.prijmeni = m[0]; if (!o.jmeno) o.jmeno = m.slice(1).join(" "); }
      else if (pole === "jmenoPrijmeni") { m = v.split(/\s+/); if (!o.prijmeni) o.prijmeni = m[m.length - 1]; if (!o.jmeno && m.length > 1) o.jmeno = m.slice(0, -1).join(" "); }
      else if (!o[pole]) o[pole] = v;
    }
    return o;
  }

  // Stejná pravidla jako na serveru (server je ale vždy rozhodující a při vložení je zkontroluje znovu).
  function kontrolaImportu() {
    var vsT = {}, jmT = {};
    I.zaci.forEach(function (z) {
      var k = normVsK(z.vs); if (k) vsT[k] = z.prijmeni + " " + z.jmeno;
      jmT[normJm(z.prijmeni + " " + z.jmeno)] = true;
    });
    var vsVkl = {}, jmVkl = {}, doplnit = $("i-vs") ? $("i-vs").checked : true;
    var sh = { ok: 0, chyba: 0, preskocit: 0, noveVs: 0, bezEmailu: 0 };
    var vysl = I.radky.map(function (bunky, idx) {
      var o = normRadek(bunky, I.mapovani);
      o.vs = o.vs.replace(/\s+/g, "");
      o.email = o.email.replace(/\s+/g, "").toLowerCase();
      o.zpravy = []; o.varovani = []; o.stav = "ok"; o.noveVs = false;
      o.emailRodice = o.emailRodice.replace(/[\s,;]+/g, " ").trim().toLowerCase().split(" ").filter(Boolean).filter(function (x, i, a) { return a.indexOf(x) === i; }).join(", ");
      if (!o.prijmeni && !o.jmeno && !o.email && !o.emailRodice && !o.vs) { o.stav = "prazdny"; return o; }
      if (!o.prijmeni) o.zpravy.push("Chybí příjmení.");
      if (o.email && !RE_EMAIL.test(o.email)) o.zpravy.push("Neplatný e-mail.");
      if (o.emailRodice) {
        var rodiceSeznam = o.emailRodice.split(", ");
        if (rodiceSeznam.some(function (x) { return !RE_EMAIL.test(x); })) o.zpravy.push("Neplatný e-mail rodiče.");
        if (rodiceSeznam.length > 4) o.zpravy.push("Nejvýš 4 e-maily rodičů na žáka.");
      }
      if (!o.email) o.varovani.push("Bez e-mailu – žák nedostane QR ani připomínku.");
      if (o.vs) {
        if (!/^[0-9]{1,10}$/.test(o.vs)) o.zpravy.push("VS musí být číslo (nejvýš 10 číslic).");
        else {
          var k = normVsK(o.vs);
          if (!k) o.zpravy.push("VS nesmí být samé nuly.");
          else if (vsT[k]) o.zpravy.push("VS už má v této třídě " + vsT[k] + ".");
          else if (vsVkl[k] !== undefined) o.zpravy.push("VS je v tabulce dvakrát (řádek " + (vsVkl[k] + 1) + ").");
          else if (I.vsJinde[k]) o.varovani.push("VS už je ve třídě: " + I.vsJinde[k] + ".");
        }
      } else if (doplnit) {
        o.noveVs = true;
      } else {
        o.varovani.push("Bez VS – nepůjdou párovat platby ani poslat QR.");
        if (!o.email) o.zpravy.push("Chybí e-mail i VS.");
      }
      if (!o.zpravy.length) {
        var nj = normJm(o.prijmeni + " " + o.jmeno);
        if (jmT[nj]) { o.stav = "preskocit"; o.zpravy.push("Žák se stejným jménem už ve třídě je."); }
        else if (jmVkl[nj] !== undefined) { o.stav = "preskocit"; o.zpravy.push("Stejné jméno je v tabulce dvakrát (řádek " + (jmVkl[nj] + 1) + ")."); }
      } else o.stav = "chyba";
      if (o.stav === "ok") {
        if (/^[0-9]{1,10}$/.test(o.vs)) vsVkl[normVsK(o.vs)] = idx;
        jmVkl[normJm(o.prijmeni + " " + o.jmeno)] = idx;
        sh.ok++; if (o.noveVs) sh.noveVs++; if (!o.email) sh.bezEmailu++;
      } else if (o.stav === "chyba") sh.chyba++; else sh.preskocit++;
      return o;
    });
    return { radky: vysl, souhrn: sh };
  }

  function stavHtml(o) {
    if (o.stav === "prazdny") return '<span class="meta">prázdný řádek (přeskočí se)</span>';
    if (o.stav === "chyba") return '<span style="color:var(--bad)">✗ ' + esc(o.zpravy.join(" ")) + "</span>";
    if (o.stav === "preskocit") return '<span class="meta">↷ přeskočí se: ' + esc(o.zpravy.join(" ")) + "</span>";
    var t = '<span style="color:var(--ok)">✓</span> ';
    if (o.noveVs) t += '<span class="meta">VS se vygeneruje</span> ';
    if (o.varovani.length) t += '<span style="color:var(--warn)">' + esc(o.varovani.join(" ")) + "</span>";
    else if (!o.noveVs) t += '<span class="meta">v pořádku</span>';
    return t;
  }

  function obnovStavy() {

  var importCasovac = null;
  function importZpracujText() {
    if (!I) return;
    var radky = rozdelVlozeny($("i-text").value);
    I.hlavicka = null; I.zkraceno = false;
    if (radky.length > 1 && jeHlavicka(radky[0])) I.hlavicka = radky.shift();
    else if (radky.length === 1 && jeHlavicka(radky[0])) radky = [];
    if (radky.length > MAX_IMPORT) { radky = radky.slice(0, MAX_IMPORT); I.zkraceno = true; }
    var sloupcu = 0;
    radky.forEach(function (r) { if (r.length > sloupcu) sloupcu = r.length; });
    if (I.hlavicka && I.hlavicka.length > sloupcu) sloupcu = I.hlavicka.length;
    radky = radky.map(function (r) { var o = r.slice(); while (o.length < sloupcu) o.push(""); return o; });
    I.radky = radky;
    I.mapovani = radky.length ? uhodniMapovani(I.hlavicka, radky, sloupcu) : [];
    renderMrizku();
  }

      var rowU = t.closest(".acct"), jU = t.getAttribute("data-j");
      if (rowU && rowU.querySelector('[data-act="ucet-schvalit"]')) return;       // u čekajícího se role použije až při schválení
      uctyZmenit({ jmeno: jU, role: t.value }, "Role změněna na „" + nazevRole(t.value) + "“: " + ucetNazev(jU) + ".");
    } else if (t.getAttribute && t.getAttribute("data-set")) {
      var klic = t.getAttribute("data-set"), val = t.checked;
      run("Ukládám nastavení…", api("nastavit", { klic: klic, hodnota: val })).then(function (n) {
        S.nastaveni = n; renderNastaveni(); toast("Nastavení uloženo.");
      }).catch(function (e) { t.checked = !val; chyba(e); });
    }
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape") return;
    if (!$("ctx").hidden) { zavriNabidku(); return; }
    if ($("modal-root").firstChild) { odeslani = null; closeModal(); }
  });
  window.addEventListener("scroll", zavriNabidkuPriPosunu, true);
  window.addEventListener("resize", zavriNabidku);

  start();
})();
</script>
</body>
</html>
